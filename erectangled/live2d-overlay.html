// ─── Mouth Animation (lip sync for Sassie TTS) ──────────────────────────────
var _mouthActive = false;
var _mouthTimer = null;

function startMouthFlap(durationMs) {
  _mouthActive = true;
  if (_mouthTimer) clearTimeout(_mouthTimer);
  _mouthTimer = setTimeout(function() { _mouthActive = false; }, durationMs);
}

function initMouthTicker() {
  var mouthT = 0;
  app.ticker.add(function() {
    if (!model || !model.internalModel) return;
    var core = model.internalModel.coreModel;
    if (_mouthActive) {
      mouthT += 0.06;
      var v = Math.abs(Math.sin(mouthT * 8)) * (0.5 + Math.sin(mouthT * 3) * 0.3);
      try { core.setParameterValueById('ParamMouthOpenY', Math.min(v, 1)); } catch(e) {}
      try { core.setParameterValueById('ParamMouthForm', 0.3 + Math.sin(mouthT * 5) * 0.2); } catch(e) {}
    } else {
      mouthT = 0;
      try { core.setParameterValueById('ParamMouthOpenY', 0); } catch(e) {}
    }
  });
}

// The retired EventSub listener was removed. Sassie now drives this overlay
// through the runtime SSE connection defined below.

// ─── Sassie Motion Gesture System ────────────────────────────────────────────
// Procedural parameter-driven gestures triggered by mapped motion IDs.
// Each gesture is a sequence of keyframes that manipulate model parameters
// over time, layered on top of the existing idle/gaze/dance system.

var sassieGesture = {
  active: false,
  motion: null,
  timer: 0,
  duration: 0,
  intensity: 0.5,
  // Current parameter offsets (applied additively in ticker)
  headX: 0, headY: 0, headZ: 0,
  bodyX: 0, bodyY: 0, bodyZ: 0,
  browLY: 0, browRY: 0,
  eyeSmileL: 0, eyeSmileR: 0,
  cheek: 0,
  posOffsetX: 0, posOffsetY: 0,
  scaleBonus: 0
};

// Gesture definitions: each returns parameter targets at progress p (0..1)
// Intensity scales the amplitude
var GESTURE_DEFS = {
  'idle_variation_01': function(p, amp) {
    // Gentle sway — subtle head tilt cycle
    return {
      headZ: Math.sin(p * Math.PI * 4) * 4 * amp,
      bodyZ: Math.sin(p * Math.PI * 2) * 2 * amp
    };
  },
  'wave_small': function(p, amp) {
    // Wave: head tilts side, body sways, slight bounce
    var wave = Math.sin(p * Math.PI * 6) * amp;  // 3 wave cycles
    var ramp = p < 0.15 ? p / 0.15 : (p > 0.8 ? (1 - p) / 0.2 : 1); // ease in/out
    return {
      headZ: wave * 8 * ramp,
      headX: Math.sin(p * Math.PI * 3) * 5 * amp * ramp,
      bodyZ: wave * 4 * ramp,
      posOffsetX: wave * 6 * ramp,
      posOffsetY: -Math.abs(Math.sin(p * Math.PI * 6)) * 8 * amp * ramp,
      eyeSmileL: 0.4 * amp * ramp,
      eyeSmileR: 0.4 * amp * ramp
    };
  },
  'smile_pose': function(p, amp) {
    // Smile: eyes squint, cheeks up, slight head tilt, settle
    var ramp = p < 0.2 ? p / 0.2 : (p > 0.7 ? (1 - p) / 0.3 : 1);
    return {
      eyeSmileL: 0.7 * amp * ramp,
      eyeSmileR: 0.7 * amp * ramp,
      cheek: 0.6 * amp * ramp,
      headZ: 5 * amp * ramp,
      headY: 3 * amp * ramp,
      browLY: 0.2 * amp * ramp,
      browRY: 0.2 * amp * ramp
    };
  },
  'laugh_small': function(p, amp) {
    // Laugh: rapid head bobbing, eye squint, body bounce
    var ramp = p < 0.1 ? p / 0.1 : (p > 0.7 ? (1 - p) / 0.3 : 1);
    var bounce = Math.abs(Math.sin(p * Math.PI * 8)) * ramp;
    return {
      posOffsetY: -bounce * 12 * amp,
      headY: -bounce * 6 * amp,
      headZ: Math.sin(p * Math.PI * 5) * 4 * amp * ramp,
      bodyZ: Math.sin(p * Math.PI * 4) * 3 * amp * ramp,
      eyeSmileL: 0.6 * amp * ramp,
      eyeSmileR: 0.6 * amp * ramp,
      cheek: 0.5 * amp * ramp
    };
  },
  'blink_slow': function(p, amp) {
    // Slow deliberate blink with slight head lower
    var blinkCurve = 0;
    if (p >= 0.3 && p <= 0.5) blinkCurve = Math.sin((p - 0.3) / 0.2 * Math.PI);
    return {
      headY: -3 * amp * blinkCurve,
      browLY: -0.3 * amp * blinkCurve,
      browRY: -0.3 * amp * blinkCurve
    };
  },
  'head_tilt': function(p, amp) {
    // Playful head tilt — tilts to one side and holds
    var ramp = p < 0.2 ? p / 0.2 : (p > 0.75 ? (1 - p) / 0.25 : 1);
    var side = (Math.random() > 0.5 ? 1 : -1); // randomized on creation, but we use consistent
    return {
      headZ: 12 * amp * ramp,
      headX: -6 * amp * ramp,
      browLY: 0.3 * amp * ramp,
      browRY: -0.1 * amp * ramp,
      eyeSmileL: 0.2 * amp * ramp,
      eyeSmileR: 0.2 * amp * ramp
    };
  },
  'surprised_react': function(p, amp) {
    // Surprised: quick recoil back, brows up, eyes wide, then settle
    var shock = p < 0.15 ? p / 0.15 : Math.max(0, 1 - (p - 0.15) / 0.85);
    var recoil = p < 0.1 ? p / 0.1 : (p < 0.3 ? 1 : Math.max(0, 1 - (p - 0.3) / 0.7));
    return {
      posOffsetY: recoil * 15 * amp,
      headY: recoil * 8 * amp,
      headX: -recoil * 4 * amp,
      browLY: 0.6 * amp * shock,
      browRY: 0.6 * amp * shock,
      bodyZ: -recoil * 5 * amp,
      scaleBonus: recoil * 0.012 * amp
    };
  },
  'nod_small': function(p, amp) {
    // Nod: 2-3 small head dips
    var ramp = p < 0.1 ? p / 0.1 : (p > 0.8 ? (1 - p) / 0.2 : 1);
    return {
      headY: Math.sin(p * Math.PI * 6) * 6 * amp * ramp,
      bodyY: Math.sin(p * Math.PI * 6) * 2 * amp * ramp,
      eyeSmileL: 0.15 * amp * ramp,
      eyeSmileR: 0.15 * amp * ramp
    };
  },
  'pout_pose': function(p, amp) {
    // Pout: head tilts down, slight side tilt, brows furrowed
    var ramp = p < 0.25 ? p / 0.25 : (p > 0.7 ? (1 - p) / 0.3 : 1);
    return {
      headY: -5 * amp * ramp,
      headZ: -6 * amp * ramp,
      browLY: -0.4 * amp * ramp,
      browRY: -0.4 * amp * ramp,
      bodyZ: -3 * amp * ramp
    };
  },
  'celebrate_short': function(p, amp) {
    // Celebrate: bouncy up-down with sway, big smile, scale pulse
    var ramp = p < 0.1 ? p / 0.1 : (p > 0.75 ? (1 - p) / 0.25 : 1);
    var bounce = Math.abs(Math.sin(p * Math.PI * 10)) * ramp;
    return {
      posOffsetY: -bounce * 18 * amp,
      posOffsetX: Math.sin(p * Math.PI * 6) * 10 * amp * ramp,
      headZ: Math.sin(p * Math.PI * 5) * 8 * amp * ramp,
      bodyZ: Math.sin(p * Math.PI * 4) * 5 * amp * ramp,
      eyeSmileL: 0.7 * amp * ramp,
      eyeSmileR: 0.7 * amp * ramp,
      cheek: 0.6 * amp * ramp,
      scaleBonus: bounce * 0.016 * amp
    };
  },
  // Fallback motions from emotion map
  'bounce_01': function(p, amp) {
    // Quick bounce — like celebrate but shorter cycle
    var ramp = p < 0.1 ? p / 0.1 : (p > 0.8 ? (1 - p) / 0.2 : 1);
    var bounce = Math.abs(Math.sin(p * Math.PI * 8)) * ramp;
    return {
      posOffsetY: -bounce * 14 * amp,
      headY: -bounce * 4 * amp,
      eyeSmileL: 0.5 * amp * ramp,
      eyeSmileR: 0.5 * amp * ramp,
      scaleBonus: bounce * 0.012 * amp
    };
  },
  'look_side': function(p, amp) {
    // Look to side — thinking gesture
    var ramp = p < 0.2 ? p / 0.2 : (p > 0.75 ? (1 - p) / 0.25 : 1);
    return {
      headX: 10 * amp * ramp,
      headZ: 4 * amp * ramp,
      browLY: 0.2 * amp * ramp,
      browRY: -0.1 * amp * ramp
    };
  },
  'recoil_small': function(p, amp) {
    // Small recoil — lighter version of surprised
    var shock = p < 0.2 ? p / 0.2 : Math.max(0, 1 - (p - 0.2) / 0.8);
    return {
      posOffsetY: shock * 10 * amp,
      headY: shock * 5 * amp,
      browLY: 0.4 * amp * shock,
      browRY: 0.4 * amp * shock,
      bodyZ: -shock * 3 * amp
    };
  },
  'chin_up': function(p, amp) {
    // Chin up — confident pose
    var ramp = p < 0.25 ? p / 0.25 : (p > 0.7 ? (1 - p) / 0.3 : 1);
    return {
      headY: 6 * amp * ramp,
      headX: -2 * amp * ramp,
      browLY: 0.15 * amp * ramp,
      browRY: 0.15 * amp * ramp,
      eyeSmileL: 0.3 * amp * ramp,
      eyeSmileR: 0.3 * amp * ramp,
      scaleBonus: 0.006 * amp * ramp
    };
  },
  'look_forward_hold': function(p, amp) {
    // Firm forward look — head straightens and holds
    var ramp = p < 0.3 ? p / 0.3 : (p > 0.8 ? (1 - p) / 0.2 : 1);
    return {
      headX: -2 * amp * ramp,
      headY: 2 * amp * ramp,
      headZ: 0,
      browLY: -0.2 * amp * ramp,
      browRY: -0.2 * amp * ramp
    };
  }
};

function triggerSassieGesture(motionId, duration, intensity) {
  if (!GESTURE_DEFS[motionId]) {
    console.log('[Live2D] Unknown gesture motion:', motionId, '— skipping');
    return;
  }
  sassieGesture.active = true;
  sassieGesture.motion = motionId;
  sassieGesture.timer = 0;
  sassieGesture.duration = duration || 3000;
  sassieGesture.intensity = Math.max(0.2, Math.min(1.2, intensity || 0.5));
  console.log('[Live2D] Gesture:', motionId, 'dur=' + sassieGesture.duration + 'ms', 'amp=' + sassieGesture.intensity.toFixed(2));
}

function tickSassieGesture(dtMs) {
  if (!sassieGesture.active) return;
  sassieGesture.timer += dtMs;
  var p = Math.min(1, sassieGesture.timer / sassieGesture.duration);

  var def = GESTURE_DEFS[sassieGesture.motion];
  if (!def) { sassieGesture.active = false; return; }

  var vals = def(p, sassieGesture.intensity);

  // Lerp current offsets toward target values for smooth transitions
  var lerp = 0.12;
  sassieGesture.headX     += ((vals.headX     || 0) - sassieGesture.headX)     * lerp;
  sassieGesture.headY     += ((vals.headY     || 0) - sassieGesture.headY)     * lerp;
  sassieGesture.headZ     += ((vals.headZ     || 0) - sassieGesture.headZ)     * lerp;
  sassieGesture.bodyX     += ((vals.bodyX     || 0) - sassieGesture.bodyX)     * lerp;
  sassieGesture.bodyY     += ((vals.bodyY     || 0) - sassieGesture.bodyY)     * lerp;
  sassieGesture.bodyZ     += ((vals.bodyZ     || 0) - sassieGesture.bodyZ)     * lerp;
  sassieGesture.browLY    += ((vals.browLY    || 0) - sassieGesture.browLY)    * lerp;
  sassieGesture.browRY    += ((vals.browRY    || 0) - sassieGesture.browRY)    * lerp;
  sassieGesture.eyeSmileL += ((vals.eyeSmileL || 0) - sassieGesture.eyeSmileL) * lerp;
  sassieGesture.eyeSmileR += ((vals.eyeSmileR || 0) - sassieGesture.eyeSmileR) * lerp;
  sassieGesture.cheek     += ((vals.cheek     || 0) - sassieGesture.cheek)     * lerp;
  sassieGesture.posOffsetX+= ((vals.posOffsetX|| 0) - sassieGesture.posOffsetX)* lerp;
  sassieGesture.posOffsetY+= ((vals.posOffsetY|| 0) - sassieGesture.posOffsetY)* lerp;
  sassieGesture.scaleBonus+= ((vals.scaleBonus|| 0) - sassieGesture.scaleBonus)* lerp;

  if (p >= 1) {
    // Fade out: lerp all offsets back to 0
    sassieGesture.active = false;
    sassieGesture.motion = null;
  }
}

/**
 * Soft-clip saturation curve for WaveShaperNode.
 * amount=0 is linear, higher values add more harmonic warmth.
 */
function _sassieMakeSaturationCurve(amount) {
  var n = 512;
  var curve = new Float32Array(n);
  for (var i = 0; i < n; i++) {
    var x = (i * 2) / n - 1;
    curve[i] = (Math.PI + amount) * x / (Math.PI + amount * Math.abs(x));
  }
  return curve;
}

/**
 * Build the Voice FX Web Audio chain for an audio element.
 * Called once per connectSassieSSE() invocation.
 * Returns true if FX is active, false if dry/failed.
 */
function _sassieInitFx(audioEl) {
  _sassieFxActive = false;
  if (_sassieFxPreset === 'dry') {
    console.log('[Live2D] Voice FX: dry (bypass)');
    return false;
  }

  var p = _SASSIE_FX_PRESETS[_sassieFxPreset];
  if (!p) {
    console.warn('[Live2D] Voice FX: unknown preset "' + _sassieFxPreset + '", using dry');
    return false;
  }

  try {
    var ctx = _sassieFxCtx || new (window.AudioContext || window.webkitAudioContext)();
    _sassieFxCtx = ctx;

    var source = ctx.createMediaElementSource(audioEl);

    // 1. High-pass filter — remove low rumble
    var hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = p.hpFreq;
    hp.Q.value = 0.707;

    // 2. Body cut — thin out low-mids for synthetic character
    var bodyCut = ctx.createBiquadFilter();
    bodyCut.type = 'peaking';
    bodyCut.frequency.value = p.bodyCutFreq;
    bodyCut.gain.value = p.bodyCutGain;
    bodyCut.Q.value = 1.0;

    // 3. Presence boost — forward clarity
    var presence = ctx.createBiquadFilter();
    presence.type = 'peaking';
    presence.frequency.value = p.presenceFreq;
    presence.gain.value = p.presenceGain;
    presence.Q.value = 1.2;

    // 4. Air boost — high-end sparkle
    var air = ctx.createBiquadFilter();
    air.type = 'peaking';
    air.frequency.value = p.airFreq;
    air.gain.value = p.airGain;
    air.Q.value = 0.8;

    // 5. Saturation — warm harmonic distortion via soft-clip waveshaper
    var saturator = ctx.createWaveShaper();
    saturator.curve = _sassieMakeSaturationCurve(p.saturation);
    saturator.oversample = '2x';

    // 6. Compressor — even out dynamic range
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = p.compThreshold;
    comp.ratio.value = p.compRatio;
    comp.knee.value = p.compKnee;
    comp.attack.value = p.compAttack;
    comp.release.value = p.compRelease;

    // 7. Low-pass filter — roll off harsh highs
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = p.lpFreq;
    lp.Q.value = 0.707;

    // 8. Output gain — compensate for processing
    var output = ctx.createGain();
    output.gain.value = p.outputGain;

    // Connect chain: source → hp → bodyCut → presence → air → saturator → comp
    source.connect(hp);
    hp.connect(bodyCut);
    bodyCut.connect(presence);
    presence.connect(air);
    air.connect(saturator);
    saturator.connect(comp);

    // Optional chorus (medium preset) — short modulated delay mixed with dry
    if (p.chorusEnabled) {
      var chorusDry = ctx.createGain();
      chorusDry.gain.value = 1.0 - p.chorusWetMix;
      var chorusWet = ctx.createGain();
      chorusWet.gain.value = p.chorusWetMix;
      var chorusDelay = ctx.createDelay(0.1);
      chorusDelay.delayTime.value = p.chorusDelayMs / 1000;

      // LFO modulates delay time for subtle movement
      var chorusLFO = ctx.createOscillator();
      chorusLFO.type = 'sine';
      chorusLFO.frequency.value = p.chorusLfoHz;
      var chorusDepthGain = ctx.createGain();
      chorusDepthGain.gain.value = p.chorusDepth;
      chorusLFO.connect(chorusDepthGain);
      chorusDepthGain.connect(chorusDelay.delayTime);
      chorusLFO.start();

      var chorusMerge = ctx.createGain();
      chorusMerge.gain.value = 1.0;

      // Split: comp → dry path + wet (delayed) path → merge
      comp.connect(chorusDry);
      comp.connect(chorusDelay);
      chorusDelay.connect(chorusWet);
      chorusDry.connect(chorusMerge);
      chorusWet.connect(chorusMerge);
      chorusMerge.connect(lp);
    } else {
      comp.connect(lp);
    }

    lp.connect(output);
    output.connect(ctx.destination);

    // Volume is now handled by the FX chain output gain
    audioEl.volume = 1.0;

    _sassieFxActive = true;
    console.log('[Live2D] Voice FX initialized: preset=' + _sassieFxPreset +
      ' (HP ' + p.hpFreq + 'Hz, presence +' + p.presenceGain + 'dB@' + p.presenceFreq +
      'Hz, sat=' + p.saturation + ', comp ' + p.compThreshold + 'dB/' + p.compRatio + ':1' +
      (p.chorusEnabled ? ', chorus' : '') + ', LP ' + p.lpFreq + 'Hz)');
    return true;
  } catch(e) {
    console.warn('[Live2D] Voice FX init failed (falling back to dry):', e.message);
    _sassieFxActive = false;
    return false;
  }
}

// Show debug overlay: ?debug=1 or ?sdebug=1 in URL, or call window.sassieDebug() from console
function _sassieShowDebug() {
  _sassieDebugVisible = true;
  if (_sassieDebugEl) _sassieDebugEl.style.display = 'block';
  _sassieUpdateDebug();
}

function _sassieUpdateDebug() {
  if (!_sassieDebugVisible || !_sassieDebugEl) return;
  var zone = getActiveStreamSafeZone();
  var targetGame = flyState && flyState.targetGame ? flyState.targetGame : '-';
  var targetX = flyState ? Math.round(flyState.tx) : '-';
  var targetY = flyState ? Math.round(flyState.ty) : '-';
  var currentX = flyState ? Math.round(flyState.x) : '-';
  var currentY = flyState ? Math.round(flyState.y) : '-';
  var fxLabel = _sassieFxPreset + (_sassieFxActive ? ' (active)' : _sassieFxPreset === 'dry' ? '' : ' (failed)');
  var lines = [
    'SASSIE OVERLAY DEBUG  (loaded ' + _sassiePageLoadedAt + ')',
    'stream: ' + (ACTIVE_STREAM_GAME || 'default') + '  safe-zone: ' + (zone ? 'ON' : 'off'),
    zone ? ('zone: x' + zone.minX + '-' + zone.maxX + '  y' + zone.minY + '-' + zone.maxY) : 'zone: none',
    'system: ' + getActiveMovementSystemLabel() + '  targetGame: ' + targetGame,
    'target: ' + targetX + ',' + targetY + '  current: ' + currentX + ',' + currentY,
    'constraint: ' + (streamDiagnostics.lastConstraintSource || 'none') + '  ' + (streamDiagnostics.lastConstraintApplied ? 'CLAMPED' : 'direct'),
    'raw target: ' + Math.round(streamDiagnostics.lastTargetRawX) + ',' + Math.round(streamDiagnostics.lastTargetRawY) + ' -> ' + Math.round(streamDiagnostics.lastTargetX) + ',' + Math.round(streamDiagnostics.lastTargetY),
    streamDiagnostics.lastWarning ? 'WARN: ' + streamDiagnostics.lastWarning : '',
    'sse: ' + (_sassieConnected ? 'CONNECTED' : 'disconnected') + '  fx: ' + fxLabel,
    'actions: ' + _sassieActions,
    'audio played: ' + _sassieAudioPlayed + '  failed: ' + _sassieAudioFailed + '  interrupted: ' + _sassieAudioInterrupted,
    'last url: ' + (_sassieLastAudioUrl ? _sassieLastAudioUrl.split('/').pop() : 'none'),
    'debugId: ' + (_sassieLastAudioDebugId || 'none'),
    'state: ' + _sassieLastAudioState,
    _sassieLastInterruptedBy ? 'INTERRUPTED BY: ' + _sassieLastInterruptedBy : '',
    _sassieLastAudioError ? 'ERROR: ' + _sassieLastAudioError : ''
  ].filter(Boolean);
  _sassieDebugEl.textContent = lines.join('\n');
}

function _getSassieBaseUrl() {
  // Check URL param override: ?sassie=host:port
  var params = new URLSearchParams(location.search);
  var override = params.get('sassie');
  if (override) return 'http://' + override;
  // Production: Sassie runtime runs on the Droplet, proxied via nginx at /api/runtime/*
  // Use same origin (HTTPS) so SSE and audio requests go through nginx to port 3036.
  // Local dev: use localhost:3036 directly.
  if (location.hostname === 'wordtycoon.live') {
    return 'https://wordtycoon.live';
  }
  return 'http://localhost:3036';
}

function connectSassieSSE() {
  var baseUrl = _getSassieBaseUrl();
  var sassieUrl = baseUrl + '/api/runtime/events';
  var evtSource;

  console.log('[Live2D] Sassie SSE connecting to', sassieUrl);

  try { evtSource = new EventSource(sassieUrl); } catch(e) {
    console.error('[Live2D] Sassie SSE EventSource failed:', e.message);
    _sassieConnected = false;
    setTimeout(connectSassieSSE, 10000);
    return;
  }

  fetch(baseUrl + '/api/runtime/stream-context')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) {
      if (d && d.ok && d.streamContext) {
        applyRuntimeStreamContext(d.streamContext, 'runtime-bootstrap');
      }
    })
    .catch(function() {});

  // Shared audio element for TTS playback
  var sassieAudio = document.createElement('audio');
  sassieAudio.volume = 0.85;

  // Initialize Voice FX chain (if not dry preset)
  // Must happen before any play() calls — MediaElementSource takes over routing.
  var fxActive = _sassieInitFx(sassieAudio);
  if (!fxActive && _sassieFxPreset !== 'dry') {
    // FX init failed, volume stays at 0.85 (element-level)
  }

  var sassieAudioUnlocked = false;
  var sassieBlockedAudioUrl = null;   // stores URL of audio blocked by autoplay
  var sassieBlockedDuration = 0;
  var pendingMouthFlap = null;  // debugId of action waiting for TTS audio

  // Chrome autoplay policy: audio.play() fails until user interacts with the page.
  // OBS browser sources bypass this automatically.
  // For Chrome tabs: we store the blocked audio URL and replay it on first click.
  function unlockAndReplay() {
    if (sassieAudioUnlocked) return;
    sassieAudioUnlocked = true;
    console.log('[Live2D] Audio unlocked by user interaction');
    // Resume Web Audio context (Chrome suspends until user gesture)
    if (_sassieFxCtx && _sassieFxCtx.state === 'suspended') {
      _sassieFxCtx.resume().then(function() {
        console.log('[Live2D] AudioContext resumed');
      }).catch(function() {});
    }
    var prompt = document.getElementById('sassie-unlock');
    if (prompt) prompt.style.display = 'none';
    // Replay the last blocked audio if any
    if (sassieBlockedAudioUrl) {
      console.log('[Live2D] Replaying blocked audio:', sassieBlockedAudioUrl);
      sassieAudio.src = sassieBlockedAudioUrl;
      sassieAudio.currentTime = 0;
      if (sassieBlockedDuration > 0) startMouthFlap(sassieBlockedDuration);
      sassieAudio.play().then(function() {
        _sassieAudioPlayed++;
        _sassieLastAudioState = 'playing (vol=' + sassieAudio.volume + ' muted=' + sassieAudio.muted + ')';
        _sassieUpdateDebug();
      }).catch(function() {});
      sassieBlockedAudioUrl = null;
      sassieBlockedDuration = 0;
    }
    _sassieUpdateDebug();
  }
  document.addEventListener('click', unlockAndReplay);
  document.addEventListener('touchstart', unlockAndReplay);
  // Try to auto-unlock (works in OBS browser source, fails silently in Chrome tabs)
  try {
    sassieAudio.play().then(function() {
      sassieAudioUnlocked = true;
      sassieAudio.pause();
      // Also resume AudioContext for FX chain
      if (_sassieFxCtx && _sassieFxCtx.state === 'suspended') {
        _sassieFxCtx.resume().catch(function() {});
      }
      console.log('[Live2D] Audio auto-unlocked (OBS/permissive env)');
    }).catch(function() {
      console.log('[Live2D] Autoplay blocked — click page to enable Sassie audio');
    });
  } catch(e) {}

    evtSource.addEventListener('sassie-action', function(e) {
      try {
        var d = JSON.parse(e.data);
        _sassieActions++;
        console.log('[Live2D] Sassie action #' + _sassieActions + ':', d.expression, d.motion, 'p' + d.priority, d.duration + 'ms', d.debugId);

      // Trigger the expression on the model
      triggerExpression(d.expression, d.priority || 4, d.duration || 3500);

      // Trigger the motion gesture
      if (d.motion) {
        triggerSassieGesture(d.motion, d.duration || 3500, d.intensity || 0.5);
      }

      // Mouth flap: if TTS is expected (reply text exists), start with estimate
      // and let sassie-audio event resync with actual duration when audio arrives
        if (d.mouthFlapMs && d.mouthFlapMs > 0) {
          startMouthFlap(d.mouthFlapMs);
          pendingMouthFlap = d.debugId;
        } else {
          pendingMouthFlap = null;
        }
        _sassieUpdateDebug();
      } catch(ex) {
        console.warn('[Live2D] Sassie action parse error:', ex);
      }
    });

  evtSource.addEventListener('sassie-audio', function(e) {
    try {
      var d = JSON.parse(e.data);
      if (!d.audioUrl) return;

      // Build full audio URL using same base as SSE connection
      var fullUrl = baseUrl + d.audioUrl;

      // Check if we're replacing active audio (indicates a server-side interrupt/promote)
      var wasPlaying = !sassieAudio.paused && sassieAudio.currentTime > 0;
      if (wasPlaying) {
        console.warn('[Live2D] New audio replacing active playback:', _sassieLastAudioDebugId, '→', d.debugId);
        _sassieAudioInterrupted++;
        _sassieLastInterruptedBy = d.debugId;
      } else {
        _sassieLastInterruptedBy = '';
      }

      _sassieLastAudioUrl = fullUrl;
      _sassieLastAudioDebugId = d.debugId || '';
      _sassieLastAudioState = 'loading';
      _sassieLastAudioError = '';

      console.log('[Live2D] Sassie TTS audio:', d.debugId, d.durationMs + 'ms', d.bytes + 'b', fullUrl);

      // Play the audio — wait for buffer before playing to prevent cutouts.
      // Use canplaythrough event to ensure the browser has enough data buffered.
      sassieAudio.preload = 'auto';
      sassieAudio.src = fullUrl;
      sassieAudio.currentTime = 0;
      _sassieLastAudioState = 'buffering';
      _sassieUpdateDebug();

      var playAttempted = false;
      function attemptPlay() {
        if (playAttempted) return;
        playAttempted = true;
        // Start mouth flap when audio actually starts (not before)
        if (d.durationMs && d.durationMs > 0) {
          startMouthFlap(d.durationMs);
        }
        sassieAudio.play().then(function() {
          _sassieAudioPlayed++;
          _sassieLastAudioState = 'playing (vol=' + sassieAudio.volume + ' muted=' + sassieAudio.muted + ')';
          console.log('[Live2D] Sassie audio playing #' + _sassieAudioPlayed, d.debugId);
          _sassieUpdateDebug();
        }).catch(function(err) {
          var isAutoplayBlock = err.message && err.message.indexOf('interact') !== -1;
          if (isAutoplayBlock && !sassieAudioUnlocked) {
            sassieBlockedAudioUrl = fullUrl;
            sassieBlockedDuration = d.durationMs || 0;
            _sassieLastAudioState = 'BLOCKED (click to unlock)';
            _sassieLastAudioError = '';
            console.warn('[Live2D] Audio autoplay blocked — click page to unlock and replay');
            var prompt = document.getElementById('sassie-unlock');
            if (prompt) prompt.style.display = '';
          } else {
            _sassieAudioFailed++;
            _sassieLastAudioState = 'FAILED';
            _sassieLastAudioError = err.message;
            console.warn('[Live2D] TTS audio play failed:', err.message);
          }
          _sassieUpdateDebug();
        });
      }
      // Wait for browser to buffer enough audio, with 3s timeout fallback
      sassieAudio.addEventListener('canplaythrough', attemptPlay, { once: true });
      setTimeout(function() { attemptPlay(); }, 3000);

      pendingMouthFlap = null;
    } catch(ex) {
      console.warn('[Live2D] Sassie audio parse error:', ex);
    }
  });

  evtSource.addEventListener('sassie-stop-audio', function(e) {
    try {
      var d = JSON.parse(e.data);
      console.log('[Live2D] Sassie stop audio:', d.debugId, '(was playing:', _sassieLastAudioDebugId, ')');
      _sassieAudioInterrupted++;
      _sassieLastInterruptedBy = 'stop:' + d.debugId;
      sassieAudio.pause();
      sassieAudio.currentTime = 0;
      _mouthActive = false;
      _sassieLastAudioState = 'stopped (interrupted by ' + d.debugId + ')';
      _sassieUpdateDebug();
    } catch(ex) {}
  });

  evtSource.addEventListener('stream-context', function(e) {
    try {
      var d = JSON.parse(e.data);
      applyRuntimeStreamContext(d, 'runtime-sse');
    } catch(ex) {
      console.warn('[Live2D] stream-context parse error:', ex);
    }
  });

  // ── Comprehensive audio lifecycle listeners ──
  // These help diagnose OBS browser-source audio issues where playback
  // starts but gets cut short by the browser environment.
  sassieAudio.addEventListener('ended', function() {
    _sassieLastAudioState = 'ended (natural)';
    _sassieUpdateDebug();
    console.log('[Live2D] Audio ended naturally:', _sassieLastAudioDebugId);
  });
  sassieAudio.addEventListener('pause', function() {
    // Ignore pause events from: intentional stop, already-ended audio, src-change on
    // finished audio, or autoplay-blocked audio (state = BLOCKED).
    var dominated = _sassieLastAudioState.indexOf('stopped') !== -1
      || _sassieLastAudioState.indexOf('ended') !== -1
      || _sassieLastAudioState.indexOf('loading') !== -1
      || _sassieLastAudioState.indexOf('BLOCKED') !== -1;
    if (!dominated && sassieAudio.currentTime > 0) {
      console.warn('[Live2D] Audio PAUSED unexpectedly at', sassieAudio.currentTime.toFixed(2) + 's:', _sassieLastAudioDebugId);
      _sassieLastAudioState = 'PAUSED at ' + sassieAudio.currentTime.toFixed(2) + 's';
      _sassieUpdateDebug();
    }
  });
  sassieAudio.addEventListener('abort', function() {
    // Ignore abort on already-ended or loading audio (normal when src changes)
    var dominated = _sassieLastAudioState.indexOf('ended') !== -1
      || _sassieLastAudioState.indexOf('loading') !== -1
      || _sassieLastAudioState.indexOf('BLOCKED') !== -1;
    if (!dominated) {
      console.warn('[Live2D] Audio ABORTED:', _sassieLastAudioDebugId);
      _sassieLastAudioState = 'ABORTED';
      _sassieUpdateDebug();
    }
  });
  sassieAudio.addEventListener('error', function(ev) {
    var code = sassieAudio.error ? sassieAudio.error.code : '?';
    var msg = sassieAudio.error ? sassieAudio.error.message : 'unknown';
    console.error('[Live2D] Audio ERROR:', code, msg, _sassieLastAudioDebugId);
    _sassieAudioFailed++;
    _sassieLastAudioState = 'ERROR code=' + code;
    _sassieLastAudioError = msg;
    _sassieUpdateDebug();
  });
  sassieAudio.addEventListener('stalled', function() {
    console.warn('[Live2D] Audio STALLED (buffering):', _sassieLastAudioDebugId);
  });
  sassieAudio.addEventListener('waiting', function() {
    console.log('[Live2D] Audio WAITING (buffering):', _sassieLastAudioDebugId);
  });

  // Expose console debug hook: type sassieDebug() in browser console
  window.sassieDebug = _sassieShowDebug;

  evtSource.onopen = function() {
    _sassieConnected = true;
    console.log('[Live2D] Sassie SSE CONNECTED to', sassieUrl);
    // Flash status briefly so OBS/dev can confirm connection
    if (statusEl) {
      statusEl.style.display = '';
      statusEl.textContent = 'sassie: connected';
      setTimeout(function() { statusEl.style.display = 'none'; }, 4000);
    }
    _sassieUpdateDebug();
  };

  evtSource.onerror = function() {
    if (evtSource.readyState === EventSource.CLOSED) {
      _sassieConnected = false;
      console.log('[Live2D] Sassie SSE DISCONNECTED, retrying in 10s');
      setTimeout(connectSassieSSE, 10000);
    } else if (evtSource.readyState === EventSource.CONNECTING) {
      // Browser is auto-reconnecting (normal SSE behavior)
      _sassieConnected = false;
      console.log('[Live2D] Sassie SSE reconnecting...');
    }
  };
}

// ─── Start ───────────────────────────────────────────────────────────────────
init();
initMouthTicker();

// Init debug element early (before SSE connects) so ?sdebug=1 works even if runtime is down
_sassieDebugEl = document.getElementById('sassie-debug');
if (SHOW_OVERLAY_DEBUG) {
  _sassieShowDebug();
}
setInterval(_sassieUpdateDebug, 500);

connectSassieSSE();

})();
</script>
</body>
</html>
