<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">erecTangled app icon</title>
  <desc id="desc">A rounded square app icon for erecTangled with bright brand lettering above a dark word-grid background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19263f"/>
      <stop offset="100%" stop-color="#080d16"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="18%" r="78%">
      <stop offset="0%" stop-color="#37d59a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#37d59a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#03050a" flood-opacity="0.44"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
