    <rect x="164" y="294" width="78" height="78" rx="20" fill="#10182b" stroke="#213657" stroke-width="6"/>
    <rect x="256" y="294" width="78" height="78" rx="20" fill="#10182b" stroke="#213657" stroke-width="6"/>
    <rect x="348" y="294" width="78" height="78" rx="20" fill="#10182b" stroke="#213657" stroke-width="6"/>
    <rect x="118" y="386" width="78" height="78" rx="20" fill="#10182b" stroke="#213657" stroke-width="6"/>
    <rect x="210" y="386" width="78" height="78" rx="20" fill="#10182b" stroke="#213657" stroke-width="6"/>
    <rect x="302" y="386" width="78" height="78" rx="20" fill="#10182b" stroke="#213657" stroke-width="6"/>
  </g>
  <g filter="url(#softShadow)" font-family="Fredoka, Arial Rounded MT Bold, Trebuchet MS, sans-serif" font-size="150" font-weight="700" text-anchor="middle">
    <text x="122" y="240" fill="#42d87f">e</text>
    <text x="208" y="240" fill="#39cfe8">r</text>
