<div class="grid-wrap">
    <div id="grid" class="grid-container"></div>
</div>

<div class="right-panel">
    <div class="overlay-header">
        <span class="game-title" style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.4rem;letter-spacing:1px"><span style="color:#44bb88">e</span><span style="color:#3EC8E8">r</span><span style="color:#F5920A">e</span><span style="color:#EFC000">c</span><span style="color:#1E52C8">T</span><span style="color:#E83020">a</span><span style="color:#42B238">n</span><span style="color:#88AAFF">g</span><span style="color:#C835B8">l</span><span style="color:#F5920A">e</span><span style="color:#1EB8A8">d</span></span>
        <span id="dailyBadge" class="badge daily" style="display:none">Daily</span>
        <span id="jackpotDisplay" class="jackpot-small">💰 0</span>
        <span id="progressText" class="progress-line"></span>
    </div>

    <div class="progress-bar-wrap" style="height:6px">
        <div id="progressBar" class="progress-bar" style="width:0%"></div>
    </div>

    <div id="recentWords" class="recent-words"></div>

    <script src="top-player-cards.js?v=9-cosmq"></script>
<script>
const socket = io();
let state = null;
const WORD_LIMIT = 18;
const recentWordsEl = document.getElementById('recentWords');
let viewerVisibility = { word_color: false, word_glow: false };
const getCosmetics = (typeof TopPlayerCards !== 'undefined' && TopPlayerCards.getCosmetics)
    ? TopPlayerCards.getCosmetics.bind(TopPlayerCards)
    : function () { return Promise.resolve({}); };

function applyViewerVisibility(cos) {
    if (!cos) return cos;
    const filtered = Object.assign({}, cos);
    Object.keys(viewerVisibility).forEach(cat => {
        if (viewerVisibility[cat] === false) delete filtered[cat];
    });
    return filtered;
}

function loadViewerVisibility() {
    return fetch('https://wordtycoon.live/api/me/visibility', { credentials: 'include' })
        .then(r => r.ok ? r.json() : { visibility: viewerVisibility })
        .then(data => {
            if (data && data.visibility && typeof data.visibility === 'object') {
                viewerVisibility = Object.assign({ word_color: false, word_glow: false }, data.visibility);
            }
        })
        .catch(() => {});
}

loadViewerVisibility();

function getWordCosmeticStyles(cos) {
    if (!cos) return null;
    cos = applyViewerVisibility(cos);
    const wordColor = cos.word_color;
    const wordGlow = cos.word_glow;
    if (!wordColor && !wordGlow) return null;
    return {
        color: (wordColor && wordColor.color) || '',
        textShadow: (wordGlow && wordGlow.textShadow) || ''
    };
}

function clearWordCosmetics(targetEl) {
    if (!targetEl) return;
    targetEl.style.color = '';
    targetEl.style.textShadow = '';
}

function applyWordCosmetics(targetEl, wordStyles) {
    if (!targetEl) return;
    clearWordCosmetics(targetEl);
    if (!wordStyles) return;
    if (wordStyles.color) targetEl.style.color = wordStyles.color;
    if (wordStyles.textShadow) targetEl.style.textShadow = wordStyles.textShadow;
}

function renderGrid(s) {
    if (!s || !s.grid) return;
    const rows = s.rows, cols = s.cols;
    const gridEl = document.getElementById('grid');
    document.documentElement.style.setProperty('--grid-cols', cols);

    const revealed = new Set(s.revealedIndices);
    const center = new Set(s.centerCells);

    // Build or update cells
    if (gridEl.children.length !== rows * cols) {
        gridEl.innerHTML = '';
        for (let i = 0; i < rows * cols; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.dataset.idx = i;
            gridEl.appendChild(cell);
        }
    }

    for (let i = 0; i < rows * cols; i++) {
        const cell = gridEl.children[i];
        const r = Math.floor(i / cols), c = i % cols;
        if (revealed.has(i)) {
            const letter = s.grid[r][c].toUpperCase();
            if (cell.textContent !== letter) cell.textContent = letter;
            cell.className = 'grid-cell revealed' + (center.has(i) ? ' center' : '');
        } else {
            cell.textContent = '';
            cell.className = 'grid-cell hidden';
        }
    }
}

function renderOverlay(s) {
    if (!s) return;
    renderGrid(s);

    document.getElementById('dailyBadge').style.display = s.isDaily ? '' : 'none';
    document.getElementById('jackpotDisplay').textContent = `💰 ${s.jackpot?.toLocaleString() || 0}`;

    const pct = s.commonWordCount ? Math.round(s.foundCommonCount / s.commonWordCount * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent =
        `${s.foundCommonCount}/${s.commonWordCount} words · ${s.revealedIndices?.length || 0}/${s.totalCells || 0} cells`;

    // Leaderboard
    TopPlayerCards.renderTopPlayerCards('top-players', s.topPlayers || []);
}

function addRecentWord(word, type, cosmeticsPromise) {
    const tag = document.createElement('div');
    tag.className = `recent-tag ${type}`;
    tag.textContent = word.toUpperCase();
    recentWordsEl.prepend(tag);
    if (cosmeticsPromise) {
        cosmeticsPromise.then((cos) => {
            applyWordCosmetics(tag, getWordCosmeticStyles(cos));
        }).catch(() => {});
    }
    // Keep max
    while (recentWordsEl.children.length > WORD_LIMIT) {
        recentWordsEl.removeChild(recentWordsEl.lastChild);
    }
}

function flashCells(cells, cosmeticsPromise) {
    if (!cells || !state) return;
    const gridEl = document.getElementById('grid');
    let wordStyles = null;
    if (cosmeticsPromise) {
        cosmeticsPromise.then((cos) => {
            wordStyles = getWordCosmeticStyles(cos);
            if (!wordStyles) return;
            for (const idx of cells) {
                const cell = gridEl.querySelector(`[data-idx="${idx}"]`);
                if (!cell || !cell.classList.contains('word-flash')) continue;
                applyWordCosmetics(cell, wordStyles);
            }
        }).catch(() => {});
    }
    for (const idx of cells) {
        const cell = gridEl.querySelector(`[data-idx="${idx}"]`);
        if (!cell) continue;
        cell.classList.add('word-flash');
        if (wordStyles) applyWordCosmetics(cell, wordStyles);
        setTimeout(() => {
            cell.classList.remove('word-flash');
            clearWordCosmetics(cell);
        }, 900);
    }
}

function revealCell(data) {
    const gridEl = document.getElementById('grid');
    const cell = gridEl.querySelector(`[data-idx="${data.index}"]`);
    if (!cell) return;
    cell.textContent = data.letter.toUpperCase();
    cell.className = 'grid-cell revealed revealing';
    setTimeout(() => cell.classList.remove('revealing'), 700);
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── End-of-round celebration hold ──────────────────────────────────
// The server builds the next board in the same tick it announces the win,
// so 'game-over' and 'new-game' arrive together. Applied straight away,
// new-game cleared the recent-words strip and re-rendered the grid while the
// winning word was still flashing — on stream the round just blinked over.
// Hold the new board until the celebration has played.
//
// Only a completion opens the window, so an admin new-game or the first
// state after connect still lands immediately.
const ROUND_CELEBRATION_MS = 5000;
let celebrationUntil = 0;
let heldState = null, heldIsNewGame = false, heldTimer = null;

function startFreshBoard(s) {
    state = s;
    recentWordsEl.innerHTML = '';
    renderOverlay(s);
}

function flushHeldState() {
    heldTimer = null;
    if (!heldState) return;
    const s = heldState, isNew = heldIsNewGame;
    heldState = null; heldIsNewGame = false;
    if (isNew) { startFreshBoard(s); } else { state = s; renderOverlay(s); }
}

// Board-changing updates route through here. During the celebration the
// freshest state is kept back and applied once, so a guess landing on the
// new board mid-window can't sneak the new grid in early either.
function applyOrHold(s, isNewGame) {
    const wait = celebrationUntil - Date.now();
    if (wait <= 0) {
        if (isNewGame) { startFreshBoard(s); } else { state = s; renderOverlay(s); }
        return;
    }
    heldState = s;
    heldIsNewGame = heldIsNewGame || isNewGame;
    if (!heldTimer) heldTimer = setTimeout(flushHeldState, wait);
}

socket.on('game-state', (s) => applyOrHold(s, false));
socket.on('new-game',   (s) => applyOrHold(s, true));
// The server emits 'game-over' (the 'game-complete' handler below has never
// fired). Used here only to protect the celebration — the overlay's own
// game-over visuals are left exactly as they are.
socket.on('game-over',  () => { celebrationUntil = Date.now() + ROUND_CELEBRATION_MS; });
socket.on('word-found', (data) => {
    const cosmeticsPromise = (data.platform && data.platformUserId)
        ? getCosmetics(data.platform, data.platformUserId)
        : Promise.resolve({});
    const type = data.isHidden ? 'hidden' : data.isCommon ? 'common' : 'rare';
    addRecentWord(data.word, type, cosmeticsPromise);
    flashCells(data.cells, cosmeticsPromise);
    if (data.finder) {
        // briefly highlight the finder name - not shown on overlay (space limited)
    }
});
socket.on('cell-revealed', revealCell);
socket.on('game-complete', (data) => {
    if (state) { state.gameOver = true; renderOverlay(state); }
});
socket.on('frenzy-update', (data) => {
    // frenzy indicator not shown in compact overlay
});
</script>
