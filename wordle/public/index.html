  <script>
    (function () {
      var storageKey = 'wordle_theme';
      var globalStorageKey = 'wordtycoon_theme';
      var root = document.documentElement;
      var meta = document.querySelector('meta[name="theme-color"]');
      var darkColor = '#111827';
      var lightColor = '#eef4fb';
      function getTheme() {
        try {
          var saved = localStorage.getItem(globalStorageKey);
          if (saved !== 'light' && saved !== 'dark') saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch (e) {}
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        if (meta) meta.setAttribute('content', theme === 'light' ? lightColor : darkColor);
      }
      applyTheme(getTheme());
    })();
  </script>
