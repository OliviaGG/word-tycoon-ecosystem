<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#151a22"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Spelling Bee Live"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="description" content="Install Spelling Bee for one-tap multiplayer hive puzzles."/>
  <title>Spelling Bee — Multiplayer</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="icon" type="image/svg+xml" href="app-icon.svg"/>
  <link rel="apple-touch-icon" href="app-icon.svg"/>
  <link rel="stylesheet" href="css/spellingbee-play.css"/>
</head>
<body>
  <!-- Login screen (Discord) -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="logo">&#127891;</div>
      <h2>Spelling Bee</h2>
      <p>Log in to play multiplayer and track your stats!</p>
      <a href="/auth/google?returnTo=/spellingbee-multi/" class="google-btn">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Login with Google
      </a>
      <div class="login-divider"><span>or</span></div>
      <a href="/auth/discord?returnTo=/spellingbee-multi/" class="discord-btn">
        <svg width="20" height="20" viewBox="0 0 71 55" fill="none">
          <path d="M60.1 4.9A58.5 58.5 0 0045.4.2a.2.2 0 00-.2.1 40.7 40.7 0 00-1.8 3.7 54 54 0 00-16.2 0A39 39 0 0025.4.3a.2.2 0 00-.2-.1A58.4 58.4 0 0010.5 5a.2.2 0 00-.1 0A59.7 59.7 0 00.4 45.2a.2.2 0 000 .2 58.9 58.9 0 0017.8 9 .2.2 0 00.3-.1 42 42 0 003.6-5.9.2.2 0 00-.1-.3 38.8 38.8 0 01-5.5-2.6.2.2 0 01 0-.4l1.1-.9a.2.2 0 01.2 0 42 42 0 0035.8 0 .2.2 0 01.2 0l1.1.9a.2.2 0 010 .4 36.4 36.4 0 01-5.5 2.6.2.2 0 00-.1.3 47.2 47.2 0 003.6 5.9.2.2 0 00.3.1 58.7 58.7 0 0017.9-9 .2.2 0 000-.2C67.5 18 63.7 9.2 60.1 4.9zM23.7 37c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2zm23.7 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2z" fill="white"/>
        </svg>
        Log in with Discord
      </a>
    </div>
  </div>

  <!-- Game UI (hidden until authenticated) -->
  <div id="game-ui" style="display:none">
    <header class="game-header">
      <a href="/portal/" class="hub-link" title="Hub">&#127968;</a>
      <h1 class="game-title">
        <span class="letter" style="color:#ffc970">S</span>
        <span class="letter" style="color:#7ee8a0">P</span>
        <span class="letter" style="color:#7eb8ff">E</span>
        <span class="letter" style="color:#ffc970">L</span>
        <span class="letter" style="color:#c98aff">L</span>
        <span class="letter" style="color:#f08090">I</span>
        <span class="letter" style="color:#7ee8a0">N</span>
        <span class="letter" style="color:#7eb8ff">G</span>
        <span class="letter" style="color:#ffc970"> </span>
        <span class="letter" style="color:#f08090">B</span>
        <span class="letter" style="color:#7ee8a0">E</span>
        <span class="letter" style="color:#ffc970">E</span>
      </h1>
      <span class="mp-badge">LIVE</span>
      <span id="daily-badge" class="daily-badge hidden">DAILY</span>
      <span id="frenzy-badge" class="frenzy-badge hidden"><span class="frenzy-label">FRENZY</span><span id="frenzy-multiplier">1.0x</span></span>
      <div class="header-controls">
        <div class="word-counter"><span id="found-count">0</span>/<span id="total-count">0</span></div>
        <span id="rare-count" class="rare-counter hidden">+0 rare</span>
        <button id="stats-toggle" class="icon-btn" title="Stats">&#128202;</button>
      </div>
    </header>

    <!-- Stats dropdown -->
    <div id="stats-dropdown" class="stats-dropdown hidden">
      <div class="stats-grid">
        <div class="stat-item"><div class="stat-val" id="stat-words">0</div><div class="stat-label">Words Found</div></div>
        <div class="stat-item"><div class="stat-val" id="stat-games">0</div><div class="stat-label">Games Played</div></div>
        <div class="stat-item"><div class="stat-val" id="stat-pangrams">0</div><div class="stat-label">Pangrams</div></div>
        <div class="stat-item"><div class="stat-val" id="stat-score">0</div><div class="stat-label">Total Score</div></div>
      </div>
    </div>

    <!-- Top players -->
    <div id="top-players" class="top-players"></div>

    <!-- Puzzle info badge -->
    <div id="puzzle-info" class="puzzle-info hidden">
      <span id="puzzle-num" class="puzzle-num"></span>
      <span id="puzzle-name" class="puzzle-name"></span>
      <span id="puzzle-theme-badge" class="puzzle-theme-badge"></span>
    </div>

    <!-- Progress bar -->
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <!-- Score -->
    <div class="score-area">
      Score: <span id="score-val" class="score-val">0</span>
    </div>

    <!-- Current word display -->
    <div class="current-word-area">
      <div id="current-word" class="current-word"></div>
    </div>

    <!-- Honeycomb -->
    <div id="honeycomb-area" class="honeycomb-area">
      <div class="hex-row" id="hex-row-top"></div>
      <div class="hex-row" id="hex-row-mid"></div>
      <div class="hex-row" id="hex-row-bot"></div>
    </div>

    <!-- Action buttons -->
    <div class="action-buttons">
      <button id="btn-delete" class="action-btn">Delete</button>
      <button id="btn-shuffle" class="action-btn">&#128260;</button>
      <button id="btn-submit" class="action-btn submit">Enter</button>
    </div>

    <!-- Incorrect guesses area -->
    <div id="incorrect-area" class="incorrect-area"></div>

    <!-- Found words -->
    <div class="found-wrapper">
      <div class="found-section">
        <h3 class="found-header">Found Words <span id="found-label">0</span></h3>
        <div id="found-words" class="found-words-list"></div>
      </div>
      <div class="found-section rare-section" id="rare-section">
        <h3 class="rare-header">&#11088; <span>Rare Words</span> <span id="rare-label">0</span></h3>
        <div id="rare-words" class="found-words-list"></div>
      </div>
    </div>

    <!-- Completion overlay -->
    <div id="win-overlay" class="win-overlay hidden">
      <div class="win-content">
        <h2>&#127891; All Words Found!</h2>
        <p id="win-stats"></p>
        <p id="win-rare-stats" class="win-rare-stats"></p>
        <p id="countdown-text" class="countdown-text"></p>
      </div>
    </div>

    <!-- Error toast -->
    <div id="error-toast" class="error-toast hidden"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/mp-init.js"></script>
  <script src="pwa-install.js"></script>
</body>
</html>
