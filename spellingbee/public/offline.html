<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spelling Bee Offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at top, rgba(255, 201, 112, 0.18), transparent 45%),
        linear-gradient(180deg, #15120d 0%, #0d0b08 100%);
      color: #fff8ea;
    }
    .card {
      width: min(100%, 420px);
      padding: 28px 24px;
      border-radius: 24px;
      background: rgba(29, 23, 14, 0.94);
      border: 1px solid rgba(255, 201, 112, 0.22);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 1.8rem; letter-spacing: -0.03em; }
    p { margin: 0; color: #ead9b1; line-height: 1.5; font-size: 1rem; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffd96f, #ffbf3f);
      color: #221606;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Spelling Bee is offline</h1>
    <p>Your app shell is installed, but the puzzle needs a connection to load fresh game data.</p>
    <a href="./">Try again</a>
  </main>
</body>
</html>
