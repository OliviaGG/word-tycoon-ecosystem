<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121213">
  <title>Betwixt Offline</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0d0f;
      --panel: #121213;
      --border: rgba(123, 104, 238, 0.35);
      --text: #f8fafc;
      --muted: #b0b4be;
      --accent: #7b68ee;
      --accent2: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(123, 104, 238, 0.18), transparent 36%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }
    .card {
      width: min(100%, 420px);
      padding: 28px 24px;
      border-radius: 24px;
      background: rgba(18, 18, 19, 0.96);
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.38);
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      background: rgba(123, 104, 238, 0.15);
      color: var(--accent2);
      font-size: 30px;
      font-weight: 800;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      letter-spacing: 0.04em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">↕</div>
    <h1>Betwixt is offline</h1>
    <p>Reconnect to keep playing live rounds or open solo once your connection is back.</p>
  </main>
</body>
</html>
