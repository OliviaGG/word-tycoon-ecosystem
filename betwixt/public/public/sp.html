<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#121213"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Betwixt"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="description" content="Install Betwixt for one-tap multiplayer rounds and solo daily play."/>
  <title>Betwixt</title>
  <link rel="manifest" href="/manifest.webmanifest?v=3"/>
  <link rel="icon" type="image/png" href="/favicon-32-v3.png"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon-v3.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="play.css?v=5"/>
  <link rel="stylesheet" href="public-shared.css?v=1"/>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <a href="https://wordtycoon.live" class="hub-btn" title="Word Tycoon Hub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <span class="title">BETWEENLY</span>
      <span class="guess-counter" id="guess-counter">0</span>
      <div class="header-actions">
        <button class="stats-toggle-btn" id="stats-toggle" title="Stats">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
        </button>
        <div class="word-size-toggle" id="word-size-toggle"></div>
      </div>
    </header>

    <!-- Login Banner (shown when not logged in) -->
    <div class="login-banner" id="login-banner">
      <span>🔒 <a href="https://wordtycoon.live/api/auth/sso-check?returnTo=https%3A%2F%2Fwordtycoon.live%2Fbetwixt%2Fplay">Login with Discord</a> to save your stats across devices</span>
      <button class="banner-close" id="banner-close">&times;</button>
    </div>

    <!-- Stats Dropdown -->
    <div class="stats-dropdown hidden" id="stats-dropdown">
      <div class="stats-dropdown-header">
        <span>Your Stats</span>
        <button class="stats-close" id="stats-close">&times;</button>
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-val" id="stat-wins">0</div>
          <div class="stat-lbl">Wins</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" id="stat-games">0</div>
          <div class="stat-lbl">Played</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" id="stat-avg">-</div>
          <div class="stat-lbl">Avg Guesses</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" id="stat-streak">0</div>
          <div class="stat-lbl">Win Streak</div>
        </div>
      </div>
      <div class="stats-history" id="stats-history"></div>
      <a href="https://wordtycoon.live/me" class="stats-portal-link" target="_blank">View full stats on Word Tycoon →</a>
    </div>

    <!-- Game Area -->
    <main id="game-area">
      <div class="boundary after" id="lower-boundary">
        <span class="bnd-label">AFTER</span>
        <span class="bnd-arrow">&darr;</span>
        <div class="bnd-tiles" id="lower-tiles"></div>
        <div class="pfp-circle" id="lower-pfp"></div>
      </div>

      <div class="confirmed-row" id="confirmed-row"></div>

      <div class="boundary before" id="upper-boundary">
        <span class="bnd-label">BEFORE</span>
        <span class="bnd-arrow">&uarr;</span>
        <div class="bnd-tiles" id="upper-tiles"></div>
        <div class="pfp-circle" id="upper-pfp"></div>
      </div>

      <div class="alphabet" id="alphabet">
        <div class="alpha-row" id="alpha-row-1"></div>
        <div class="alpha-row" id="alpha-row-2"></div>
      </div>
    </main>

    <!-- QWERTY Keyboard -->
    <div class="keyboard" id="keyboard"></div>

    <!-- Error toast -->
    <div class="error-toast hidden" id="error-toast"></div>

    <!-- Win overlay -->
    <div class="win-overlay hidden" id="win-overlay">
      <div class="win-modal">
        <div class="win-pic" id="win-pic"></div>
        <div class="win-name" id="win-name"></div>
        <div class="win-word" id="win-word"></div>
        <div class="win-info">Found in <strong id="win-count"></strong> guesses</div>
        <div class="win-countdown" id="win-countdown"></div>
      </div>
    </div>
  </div>

  <script src="sp-engine.js?v=4"></script>
  <script src="/pwa-install.js"></script>
</body>
</html>
