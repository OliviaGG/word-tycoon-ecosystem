<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecTangled Logo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: 0.02em;
            text-decoration: none;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <a href="https://wordtycoon.live/portal" class="logo" style="text-decoration:none;">
        <span style="color:#3EC8E8">r</span><span style="color:#F5920A">e</span><span style="color:#EFC000">c</span><span style="color:#1E52C8">T</span><span style="color:#E83020">a</span><span style="color:#42B238">n</span><span style="color:#88AAFF">g</span><span style="color:#C835B8">l</span><span style="color:#F5920A">e</span><span style="color:#1EB8A8">d</span>
    </a>
</body>
</html>
