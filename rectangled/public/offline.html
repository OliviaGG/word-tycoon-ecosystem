<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1320">
  <title>recTangled Offline</title>
  <link rel="icon" type="image/png" href="/favicon-32-v3.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #09101b;
      --surface: rgba(17, 24, 39, 0.94);
      --surface-border: rgba(90, 116, 164, 0.34);
      --text: #f8fafc;
      --muted: #8da0c0;
      --accent: #35d7ff;
      --accent-2: #ffd24d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top center, rgba(52, 97, 178, 0.24), transparent 32%),
        linear-gradient(180deg, #0d1320 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }
    .card {
      width: min(100%, 420px);
      padding: 28px 24px;
      border-radius: 24px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.34);
      text-align: center;
    }
    .icon {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      display: block;
    }
    h1 {
      margin: 0 0 10px;
      font-family: Fredoka, "Arial Rounded MT Bold", sans-serif;
      font-size: 2rem;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a,
    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
    }
    .primary {
      background: linear-gradient(180deg, #49e1ff, #22c7ff);
      color: #071018;
    }
    .secondary {
      background: rgba(255, 210, 77, 0.12);
      color: var(--accent-2);
      border: 1px solid rgba(255, 210, 77, 0.24);
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/app-icon.png" alt="recTangled app icon">
    <h1>recTangled is Offline</h1>
    <p>The live board needs a connection, but your installed app shell is ready to reopen as soon as you’re back online.</p>
    <div class="actions">
      <button class="primary" type="button" onclick="location.reload()">Try Again</button>
      <a class="secondary" href="/mobile.html">Open Live Game</a>
    </div>
  </main>
  <footer class="wt-legal-footer">
    <a href="https://wordtycoon.live/privacy" target="_blank" rel="noopener">Privacy</a> &middot; <a href="https://wordtycoon.live/terms" target="_blank" rel="noopener">Terms</a> &middot; <a href="https://discord.gg/C8Nm2jEZFC" target="_blank" rel="noopener">Discord</a> &middot; <a href="https://www.jorry.live" target="_blank" rel="noopener">jorry.live</a> &middot; <a href="https://wordtycoon.live/portal">&copy; 2026 Word Tycoon</a>
  </footer>
  <style>
    .wt-legal-footer{padding:14px 16px 18px;text-align:center;font:12px/1.4 "Segoe UI",Tahoma,sans-serif;color:#7a8a9b;opacity:.75}
    .wt-legal-footer a{color:inherit;text-decoration:none;margin:0 2px}
    .wt-legal-footer a:hover{text-decoration:underline;opacity:1}
  </style>
</body>
</html>
