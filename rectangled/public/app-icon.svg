<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">recTangled app icon</title>
  <desc id="desc">A rounded square app icon for recTangled with bright brand lettering over a dark game-grid background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172238"/>
      <stop offset="100%" stop-color="#090d17"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#385fb8" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#385fb8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#385fb8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#02040a" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <g opacity="0.9">
    <rect x="84" y="292" width="72" height="72" rx="18" fill="#11192b" stroke="#223457" stroke-width="6"/>
    <rect x="170" y="292" width="72" height="72" rx="18" fill="#11192b" stroke="#223457" stroke-width="6"/>
    <rect x="256" y="292" width="72" height="72" rx="18" fill="#11192b" stroke="#223457" stroke-width="6"/>
    <rect x="342" y="292" width="72" height="72" rx="18" fill="#11192b" stroke="#223457" stroke-width="6"/>
    <rect x="84" y="378" width="72" height="72" rx="18" fill="#11192b" stroke="#223457" stroke-width="6"/>
    <rect x="170" y="378" width="72" height="72" rx="18" fill="#11192b" stroke="#223457" stroke-width="6"/>
    <rect x="256" y="378" width="72" height="72" rx="18" fill="#11192b" stroke="#223457" stroke-width="6"/>
    <rect x="342" y="378" width="72" height="72" rx="18" fill="#11192b" stroke="#223457" stroke-width="6"/>
  </g>
  <g filter="url(#softShadow)" font-family="Fredoka, Arial Rounded MT Bold, Trebuchet MS, sans-serif" font-size="176" font-weight="700" text-anchor="middle">
    <text x="152" y="248" fill="#3ec8e8">r</text>
    <text x="254" y="248" fill="#f5920a">e</text>
    <text x="356" y="248" fill="#efc000">c</text>
  </g>
  <rect x="64" y="64" width="384" height="384" rx="92" fill="none" stroke="rgba(255,255,255,0.08)"/>
</svg>
