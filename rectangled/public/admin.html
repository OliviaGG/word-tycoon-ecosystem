<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecTangled Admin</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117; --surface: #151d28; --surface2: #1c2736; --border: #2a3a4e;
    --text: #e8e8f0; --text-dim: #6a7a8e; --red: #e74c3c; --green: #4ade80;
    --yellow: #f1c40f; --accent: #e94560;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }
  #conn-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); margin-left: auto; }
  #conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); transition: background 0.3s; }
  #conn-dot.connected { background: var(--green); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .card h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: var(--text-dim); font-size: 13px; }
  .stat-value { font-weight: 600; color: var(--text); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .badge-active { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge-over { background: rgba(231,76,60,0.15); color: var(--red); }
  .badge-frenzy { background: rgba(241,196,15,0.15); color: var(--yellow); }
  .word-display { font-size: 18px; letter-spacing: 3px; font-weight: 700; font-family: monospace; color: var(--accent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-surface { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .toggle-row:last-of-type { border-bottom: none; }
  .toggle-label { color: var(--text-dim); font-size: 13px; }
  .toggle { position: relative; display: inline-block; width: 40px; height: 22px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 22px; cursor: pointer; transition: background 0.2s; }
  .toggle-slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: var(--text-dim); border-radius: 50%; transition: transform 0.2s, background 0.2s; }
  .toggle input:checked + .toggle-slider { background: var(--accent); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(18px); background: #fff; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .form-group input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; color: var(--text); font-size: 13px; outline: none; }
  .form-group input:focus { border-color: var(--accent); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .xp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.5s; }
  .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
  .history-list::-webkit-scrollbar { width: 4px; } .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .history-item { background: var(--surface2); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  .history-item .h-word { font-weight: 700; color: var(--accent); font-family: monospace; letter-spacing: 2px; }
  .history-item .h-meta { color: var(--text-dim); font-size: 12px; margin-top: 3px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface2); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 16px; font-size: 13px; color: var(--text); z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>RecTangled Admin</h1>
  <div id="conn-status"><div id="conn-dot"></div><span id="conn-label">Disconnected</span></div>
</header>
<div class="grid">
  <!-- Card 1: Current Game -->
  <div class="card">
    <h2>Current Game</h2>
    <div class="stat-row">
      <span class="stat-label">Daily Word</span>
      <span class="word-display" id="current-word">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Grid Size</span>
      <span class="stat-value" id="grid-size">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Status</span>
      <span id="game-status"><span class="badge badge-active">Active</span></span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Players</span>
      <span class="stat-value" id="player-count">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Words Found</span>
      <span class="stat-value" id="words-found">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Jackpot XP</span>
      <span class="stat-value" id="jackpot-xp">—</span>
    </div>
    <div id="words-progress" style="padding:6px 0;display:none;">
      <div class="progress-bar"><div class="progress-fill" id="words-progress-fill" style="width:0%"></div></div>
    </div>
  </div>

  <!-- Card 2: Controls -->
  <div class="card">
    <h2>Controls</h2>
    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn btn-accent" onclick="startDaily()">Start Daily</button>
      <button class="btn btn-danger" onclick="resetXp()">Reset XP</button>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Jackpot Enabled</span>
      <label class="toggle"><input type="checkbox" id="toggle-jackpot" onchange="setJackpotEnabled(this.checked)"><span class="toggle-slider"></span></label>
    </div>
    <div class="toggle-row" style="margin-bottom:14px;">
      <span class="toggle-label">Daily Jackpot</span>
      <label class="toggle"><input type="checkbox" id="toggle-daily" onchange="setDailyEnabled(this.checked)"><span class="toggle-slider"></span></label>
    </div>
    <div class="xp-grid">
      <div class="form-group"><label>Base XP</label><input type="number" id="xp-base" min="0"></div>
      <div class="form-group"><label>Per Guess</label><input type="number" id="xp-per-guess" min="0"></div>
      <div class="form-group"><label>Per Second</label><input type="number" id="xp-per-second" min="0" step="0.1"></div>
      <div class="form-group"><label>Max XP</label><input type="number" id="xp-max" min="0"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-accent" onclick="saveXpSettings()">Save XP Settings</button>
    </div>
  </div>

  <!-- Card 3: Game History -->
  <div class="card" style="grid-column: span 2;">
    <h2>Game History</h2>
    <div class="history-list" id="history-list">
      <div style="color:var(--text-dim);font-size:13px;text-align:center;padding:20px 0;">Loading…</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const socket = io();

function getAdminKey() {
  let key = sessionStorage.getItem('adminKey');
  if (!key) { key = prompt('Enter admin password:'); if (key) sessionStorage.setItem('adminKey', key); }
  return key || '';
}
function adminFetch(url, opts = {}) {
  const headers = { ...(opts.headers || {}), 'x-admin-key': getAdminKey(), 'Content-Type': 'application/json' };
  return fetch(url, { ...opts, headers });
}

function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = isErr ? 'var(--red)' : 'var(--accent)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function timeAgo(ts) {
  if (!ts) return '—';
  const d = Math.floor((Date.now() - new Date(ts)) / 1000);
  if (d < 60) return d + 's ago';
  if (d < 3600) return Math.floor(d/60) + 'm ago';
  if (d < 86400) return Math.floor(d/3600) + 'h ago';
  return Math.floor(d/86400) + 'd ago';
}

function renderState(state) {
  const word = state.word || '—';
  document.getElementById('current-word').textContent = typeof word === 'string' ? word.toUpperCase() : '—';
  document.getElementById('grid-size').textContent = (state.rows && state.cols) ? `${state.rows} × ${state.cols}` : '—';
  document.getElementById('player-count').textContent = state.playerCount ?? '—';
  document.getElementById('jackpot-xp').textContent = state.jackpot != null ? state.jackpot + ' XP' : '—';

  const foundCount = typeof state.foundWords === 'object' ? Object.keys(state.foundWords).length : (state.foundWords || 0);
  const total = state.allWordsCount || state.commonWordsCount || 0;
  document.getElementById('words-found').textContent = total ? `${foundCount} / ${total}` : (foundCount || '—');

  if (total > 0) {
    const pct = Math.min(100, Math.round((foundCount / total) * 100));
    document.getElementById('words-progress').style.display = 'block';
    document.getElementById('words-progress-fill').style.width = pct + '%';
  }

  const statusEl = document.getElementById('game-status');
  let statusHTML = '';
  if (state.frenzy) {
    statusHTML += '<span class="badge badge-frenzy" style="margin-right:4px;">Frenzy</span>';
  }
  statusHTML += state.isDaily ? '<span class="badge badge-active">Daily</span>' : '<span class="badge badge-active">Active</span>';
  statusEl.innerHTML = statusHTML;
}

async function loadHistory() {
  try {
    const res = await fetch('/api/game/history');
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const el = document.getElementById('history-list');
    const arr = Array.isArray(data) ? data : (data.history || []);
    if (!arr.length) {
      el.innerHTML = '<div style="color:var(--text-dim);font-size:13px;text-align:center;padding:20px 0;">No history yet.</div>';
      return;
    }
    el.innerHTML = arr.slice(0, 20).map(h => {
      const found = typeof h.foundWords === 'object' ? Object.keys(h.foundWords).length : (h.wordsFound || h.foundCount || '?');
      const total = h.allWordsCount || h.totalWords || '?';
      return `<div class="history-item">
        <div><span class="h-word">${(h.word||'?????').toUpperCase()}</span></div>
        <div class="h-meta">${h.winner?.displayName ? '🏆 ' + h.winner.displayName + ' · ' : ''}${found}/${total} words · ${h.rows}×${h.cols} grid · ${timeAgo(h.endedAt || h.createdAt)}</div>
      </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('history-list').innerHTML = '<div style="color:var(--red);font-size:13px;">Failed to load history.</div>';
  }
}

async function loadJackpotSettings() {
  try {
    const res = await fetch('/api/jackpot/settings');
    if (!res.ok) return;
    const d = await res.json();
    document.getElementById('toggle-jackpot').checked = !!d.enabled;
    document.getElementById('toggle-daily').checked = !!d.dailyEnabled;
    document.getElementById('xp-base').value = d.base ?? '';
    document.getElementById('xp-per-guess').value = d.perGuess ?? '';
    document.getElementById('xp-per-second').value = d.perSecond ?? '';
    document.getElementById('xp-max').value = d.max ?? '';
  } catch(e) {}
}

async function loadState() {
  try {
    const res = await fetch('/api/game/state');
    if (!res.ok) throw new Error(res.status);
    renderState(await res.json());
  } catch(e) {}
}

async function startDaily() {
  if (!confirm('Start the daily game?')) return;
  try {
    const res = await adminFetch('/api/game/start-daily', { method: 'POST', body: '{}' });
    showToast(res.ok ? 'Daily game started!' : 'Failed to start daily', !res.ok);
    if (res.ok) loadState();
  } catch(e) { showToast('Error', true); }
}

async function setJackpotEnabled(val) {
  try {
    const res = await adminFetch('/api/jackpot/settings', { method: 'POST', body: JSON.stringify({ enabled: val }) });
    showToast(res.ok ? 'Jackpot ' + (val ? 'enabled' : 'disabled') : 'Failed', !res.ok);
  } catch(e) { showToast('Error', true); }
}

async function setDailyEnabled(val) {
  try {
    const res = await adminFetch('/api/jackpot/settings', { method: 'POST', body: JSON.stringify({ dailyEnabled: val }) });
    showToast(res.ok ? 'Daily jackpot ' + (val ? 'enabled' : 'disabled') : 'Failed', !res.ok);
  } catch(e) { showToast('Error', true); }
}

async function saveXpSettings() {
  const body = {
    base: parseFloat(document.getElementById('xp-base').value),
    perGuess: parseFloat(document.getElementById('xp-per-guess').value),
    perSecond: parseFloat(document.getElementById('xp-per-second').value),
    max: parseFloat(document.getElementById('xp-max').value)
  };
  try {
    const res = await adminFetch('/api/jackpot/settings', { method: 'POST', body: JSON.stringify(body) });
    showToast(res.ok ? 'XP settings saved!' : 'Failed to save', !res.ok);
  } catch(e) { showToast('Error', true); }
}

async function resetXp() {
  if (!confirm('Reset jackpot XP to base value?')) return;
  try {
    const res = await adminFetch('/api/jackpot/reset', { method: 'POST', body: '{}' });
    showToast(res.ok ? 'XP reset!' : 'Failed to reset', !res.ok);
    if (res.ok) loadState();
  } catch(e) { showToast('Error', true); }
}

// Socket
socket.on('connect', () => {
  socket.emit('admin-auth', getAdminKey());
  document.getElementById('conn-dot').classList.add('connected');
  document.getElementById('conn-label').textContent = 'Connected';
});
socket.on('disconnect', () => {
  document.getElementById('conn-dot').classList.remove('connected');
  document.getElementById('conn-label').textContent = 'Disconnected';
});
socket.on('game-state', (data) => { renderState(data); });
socket.on('new-game', (data) => { if (data) renderState(data); loadHistory(); });
socket.on('game-over', () => { loadState(); loadHistory(); });

// Init
loadState();
loadHistory();
loadJackpotSettings();
setInterval(loadState, 10000);
</script>
</body>
</html>
