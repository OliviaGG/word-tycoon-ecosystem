<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=640" />
  <title>WiKirecTangled — streamer room</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/img/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=20261003-keyboard" />
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // When embedded in a streamer overlay (?obs=1 / ?streamer_self=1 / inside
    // an iframe), apply the .obs-mode body class. Triggers the glass CSS at
    // the end of style.css: transparent body so the parent's animated bg
    // shows through, and backdrop-filter on the major panels for true
    // glassmorphism (frosted-glass cards over moving color).
    (function () {
      try {
        var q = new URLSearchParams(location.search);
        var inIframe = window.parent && window.parent !== window;
        if (q.get('obs') === '1' || q.get('streamer_self') === '1' || inIframe) {
          document.documentElement.classList.add('obs-mode');
        }
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="https://wordtycoon.live/portal/assets/badges/perk-badges.css?b3">
  <script src="https://wordtycoon.live/portal/assets/badges/perk-badges.js?b3"></script>
</head>
<body class="streamer-mode">
  <header class="topbar">
    <img src="/img/logo.png" alt="WiKirecTangled" class="logo" id="logo" />
    <div class="topbar-spacer"></div>
    <div class="counts">
      <span class="count g"><span class="badge">G</span><b id="grid-found">0</b></span>
      <span class="count t"><span class="badge">T</span><b id="title-found">0</b><span class="slash">/</span><span class="total" id="title-total">0</span></span>
      <span class="count c"><span class="badge">C</span><b id="common-found">0</b><span class="slash">/</span><span class="total" id="common-total">0</span></span>
    </div>
    <button class="mute-toggle" id="muteToggle" type="button" aria-pressed="false" aria-label="Toggle sound">
      <svg class="icon-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <svg class="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
    </button>
  </header>

  <div class="streamer-status" id="streamer-status">Waiting for chat to start a round…</div>

  <main class="layout">
    <section class="left-col">
      <div class="title-block">
        <div class="title-eyebrow">TITLE</div>
        <div class="title-chips" id="title-chips"></div><div class="title-tier-status" id="title-tier-status" data-active="false"></div>
      </div>
      <div class="leader-spacer"></div>
      <div class="players-row" id="players-row"></div>
    </section>
    <section class="right-col">
      <div id="target-cards"></div>
    </section>
    <div class="found-words-card" id="found-words-card">
      <div class="found-words-list" id="found-words-list"></div>
    </div>
  </main>

  <div class="ticker" id="ticker"><div class="ticker-track" id="ticker-track"></div></div>

  <section class="grid-wrap">
    <div class="grid" id="grid"></div>
    <svg class="swipe-svg" id="swipe-svg"></svg>
  </section>

  <form class="composer" id="composer" autocomplete="off">
    <input type="text" id="guess-input" aria-label="Guess a word" placeholder="Type or Swipe" autocomplete="off" autofocus />
    <button type="submit">Guess</button>
  </form>
  <div class="win-strip" id="win-strip">
    <span class="count t"><span class="badge">T</span><b id="win-title-found">0</b><span class="slash">/</span><span class="total" id="win-title-total">0</span></span>
    <span class="count c"><span class="badge">C</span><b id="win-common-found">0</b><span class="slash">/</span><span class="total" id="win-common-total">0</span></span>
    <span class="count r"><span class="badge">R</span><b id="win-rare-found">0</b><span class="slash">/</span><span class="total" id="win-rare-total">0</span></span>
    <span class="count u"><span class="badge">U</span><b id="win-ultra-found">0</b><span class="slash">/</span><span class="total" id="win-ultra-total">0</span></span>
  </div>
  <div class="player-strip">
    Playing as <button type="button" id="rename-link" aria-label="Change display name"></button> · chat from this streamer also routes here
  </div>

  <script src="/js/ticker.js?v=20260914a"></script>
  <script src="/js/cosmetics-cache.js?v=20260808n"></script>
  <script src="/js/cosmetics-applier.js?v=20260808n"></script>
  <script src="/js/xp-flyout.js?v=20260822perfc"></script>
  <script src="https://wordtycoon.live/js/win-card.js"></script>
  <script src="/js/sfx-engine.js?v=1778139617"></script>
  <script src="/js/streamer.js?v=20261003borders"></script>
  <div id="word-announce" class="word-announce">
    <div class="wa-pfp" id="wa-pfp"></div>
    <div class="wa-info">
      <div class="wa-name" id="wa-name"></div>
      <div class="wa-line">
        <span class="wa-word" id="wa-word"></span>
        <span class="wa-pts" id="wa-pts"></span>
      </div>
    </div>
  </div>
<script src="https://wordtycoon.live/portal/js/session-disable-gate.js?v=3"></script>
  <footer class="wt-legal-footer">
    <a href="https://wordtycoon.live/privacy" target="_blank" rel="noopener">Privacy</a> &middot; <a href="https://wordtycoon.live/terms" target="_blank" rel="noopener">Terms</a> &middot; <a href="https://discord.gg/C8Nm2jEZFC" target="_blank" rel="noopener">Discord</a> &middot; <a href="https://www.jorry.live" target="_blank" rel="noopener">jorry.live</a> &middot; <a href="https://wordtycoon.live/portal">&copy; 2026 Word Tycoon</a>
  </footer>
  <style>
    .wt-legal-footer{padding:14px 16px 18px;text-align:center;font:12px/1.4 "Segoe UI",Tahoma,sans-serif;color:#7a8a9b;opacity:.75}
    .wt-legal-footer a{color:inherit;text-decoration:none;margin:0 2px}
    .wt-legal-footer a:hover{text-decoration:underline;opacity:1}
  </style>
</body>
</html>
