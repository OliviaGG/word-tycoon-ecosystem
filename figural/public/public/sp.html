<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111826">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Figural">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Install Figural for solo daily and practice symbol-word puzzles.">
  <title>Figural</title>
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <link rel="icon" type="image/png" href="favicon-32-v3.png">
  <link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <a href="https://wordtycoon.live" class="hub-btn" title="Word Tycoon Hub">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <h1 id="title">FIGURAL</h1>
      <div id="status">
        <span id="guesses-left">8 left</span>
        <span id="word-length-tag"></span>
      </div>
      <div class="header-actions">
        <button class="stats-toggle-btn" id="stats-toggle" title="Stats">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
        </button>
        <div class="word-size-toggle" id="word-size-toggle"></div>
      </div>
    </header>

    <!-- Stats Dropdown -->
    <div class="stats-dropdown hidden" id="stats-dropdown">
      <div class="stats-dropdown-header">
        <span>Your Stats</span>
        <button class="stats-close" id="stats-close">&times;</button>
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-val" id="stat-wins">0</div>
          <div class="stat-lbl">Wins</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" id="stat-games">0</div>
          <div class="stat-lbl">Played</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" id="stat-avg">-</div>
          <div class="stat-lbl">Avg Guesses</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" id="stat-streak">0</div>
          <div class="stat-lbl">Streak</div>
        </div>
      </div>
      <div class="stats-history" id="stats-history"></div>
      <a href="https://wordtycoon.live/me" class="stats-portal-link" target="_blank">View full stats on Word Tycoon →</a>
    </div>

    <div id="legend">
      <div class="legend-item" id="legend-0">
        <span class="legend-symbol"></span>
        <span class="legend-meaning">= ?</span>
      </div>
      <div class="legend-item" id="legend-1">
        <span class="legend-symbol"></span>
        <span class="legend-meaning">= ?</span>
      </div>
      <div class="legend-item" id="legend-2">
        <span class="legend-symbol"></span>
        <span class="legend-meaning">= ?</span>
      </div>
    </div>

    <div id="board"></div>

    <div id="message"></div>

    <div id="keyboard">
      <div class="kb-row">
        <button class="kb-key" data-key="Q">Q</button>
        <button class="kb-key" data-key="W">W</button>
        <button class="kb-key" data-key="E">E</button>
        <button class="kb-key" data-key="R">R</button>
        <button class="kb-key" data-key="T">T</button>
        <button class="kb-key" data-key="Y">Y</button>
        <button class="kb-key" data-key="U">U</button>
        <button class="kb-key" data-key="I">I</button>
        <button class="kb-key" data-key="O">O</button>
        <button class="kb-key" data-key="P">P</button>
      </div>
      <div class="kb-row">
        <div class="kb-spacer-half"></div>
        <button class="kb-key" data-key="A">A</button>
        <button class="kb-key" data-key="S">S</button>
        <button class="kb-key" data-key="D">D</button>
        <button class="kb-key" data-key="F">F</button>
        <button class="kb-key" data-key="G">G</button>
        <button class="kb-key" data-key="H">H</button>
        <button class="kb-key" data-key="J">J</button>
        <button class="kb-key" data-key="K">K</button>
        <button class="kb-key" data-key="L">L</button>
        <div class="kb-spacer-half"></div>
      </div>
      <div class="kb-row">
        <button class="kb-key kb-wide" data-key="Enter">ENTER</button>
        <button class="kb-key" data-key="Z">Z</button>
        <button class="kb-key" data-key="X">X</button>
        <button class="kb-key" data-key="C">C</button>
        <button class="kb-key" data-key="V">V</button>
        <button class="kb-key" data-key="B">B</button>
        <button class="kb-key" data-key="N">N</button>
        <button class="kb-key" data-key="M">M</button>
        <button class="kb-key kb-wide" data-key="Backspace">&#9003;</button>
      </div>
    </div>

    <div id="win-overlay" class="hidden">
      <div id="win-content">
        <div id="win-emoji">🎉</div>
        <div id="win-label">DECODED!</div>
        <div id="win-word"></div>
        <div id="win-info"></div>
        <button id="new-game-btn" class="neon-btn">NEW GAME</button>
      </div>
    </div>

    <div id="fail-overlay" class="hidden">
      <div id="fail-content">
        <div id="fail-emoji">😔</div>
        <div id="fail-label">OUT OF GUESSES</div>
        <div id="fail-word"></div>
        <button id="fail-new-game-btn" class="neon-btn">NEW GAME</button>
      </div>
    </div>
  </div>

  <script src="sp-engine.js?v=4"></script>
  <script src="pwa-install.js"></script>
</body>
</html>
