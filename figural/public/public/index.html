<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figural</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1 id="title">FIGURAL</h1>
      <div id="status">
        <span id="guesses-left">8 left</span>
        <span id="word-length-tag"></span>
        <span id="jackpot">50</span>
        <span id="daily-badge" class="daily-badge" style="display:none">DAILY</span>
        <span id="frenzy-badge" class="frenzy-badge" style="display:none">
          <span class="frenzy-label">FRENZY</span>
          <span id="frenzy-mult">1.0x</span>
        </span>
      </div>
    </header>

    <div id="legend">
      <div class="legend-item" id="legend-0">
        <span class="legend-symbol"></span>
        <span class="legend-meaning">= ?</span>
      </div>
      <div class="legend-item" id="legend-1">
        <span class="legend-symbol"></span>
        <span class="legend-meaning">= ?</span>
      </div>
      <div class="legend-item" id="legend-2">
        <span class="legend-symbol"></span>
        <span class="legend-meaning">= ?</span>
      </div>
    </div>

    <div id="board"></div>

    <div id="message"></div>

    <div id="keyboard">
      <div class="kb-row">
        <button class="kb-key" data-key="Q">Q</button>
        <button class="kb-key" data-key="W">W</button>
        <button class="kb-key" data-key="E">E</button>
        <button class="kb-key" data-key="R">R</button>
        <button class="kb-key" data-key="T">T</button>
        <button class="kb-key" data-key="Y">Y</button>
        <button class="kb-key" data-key="U">U</button>
        <button class="kb-key" data-key="I">I</button>
        <button class="kb-key" data-key="O">O</button>
        <button class="kb-key" data-key="P">P</button>
      </div>
      <div class="kb-row">
        <div class="kb-spacer-half"></div>
        <button class="kb-key" data-key="A">A</button>
        <button class="kb-key" data-key="S">S</button>
        <button class="kb-key" data-key="D">D</button>
        <button class="kb-key" data-key="F">F</button>
        <button class="kb-key" data-key="G">G</button>
        <button class="kb-key" data-key="H">H</button>
        <button class="kb-key" data-key="J">J</button>
        <button class="kb-key" data-key="K">K</button>
        <button class="kb-key" data-key="L">L</button>
        <div class="kb-spacer-half"></div>
      </div>
      <div class="kb-row">
        <button class="kb-key kb-wide" data-key="Enter">ENTER</button>
        <button class="kb-key" data-key="Z">Z</button>
        <button class="kb-key" data-key="X">X</button>
        <button class="kb-key" data-key="C">C</button>
        <button class="kb-key" data-key="V">V</button>
        <button class="kb-key" data-key="B">B</button>
        <button class="kb-key" data-key="N">N</button>
        <button class="kb-key" data-key="M">M</button>
        <button class="kb-key kb-wide" data-key="Backspace">&#9003;</button>
      </div>
    </div>

    <div id="win-overlay" class="hidden">
      <div id="win-content">
        <div id="win-label">DECODED!</div>
        <div id="win-word"></div>
        <div id="win-player"></div>
        <div id="win-jackpot"></div>
      </div>
    </div>

    <div id="fail-overlay" class="hidden">
      <div id="fail-content">
        <div id="fail-label">OUT OF GUESSES</div>
        <div id="fail-word"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
