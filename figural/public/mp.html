  <script>
    (function () {
      var storageKey = 'figural_theme';
      var globalStorageKey = 'wordtycoon_theme';
      var root = document.documentElement;
      var meta = document.querySelector('meta[name="theme-color"]');
      function getTheme() {
        // wt-obs-force-dark: an OBS browser source runs a fresh CEF profile with no
        // saved theme, so this used to fall through to prefers-color-scheme —
        // and render1's OBS reports LIGHT, putting a near-white board on the
        // stream. A stream embed is always dark. Checked BEFORE localStorage
        // so it holds even if a light theme lands in the OBS profile.
        try { if (/[?&]obs=1(&|$)/.test(location.search)) return 'dark'; } catch (e) {}
        try {
          var saved = localStorage.getItem(globalStorageKey);
          if (saved !== 'light' && saved !== 'dark') saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch (e) {}
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      var theme = getTheme();
      root.setAttribute('data-theme', theme);
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f8fafc' : '#000000');
    })();
  </script>
