  <style>
    /* Lock body — all scrolling happens inside #scroll-wrap */
    html,body{margin:0;padding:0;overflow:hidden;height:100%;width:100%;}

    /* ─── Scroll wrapper: sits above renderers, scrolls independently ─── */
    #scroll-wrap{
      position:fixed;top:0;left:0;width:100%;height:100%;
      z-index:2;
      overflow-y:auto;overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
      pointer-events:none;
    }
    #scroll-wrap.kb-open{overflow:hidden;}

    /* ─── Spacer: transparent area over the fixed 3D game ─── */
    #game-spacer{height:100vh;pointer-events:none;}

    /* Hide Previous Guesses section — 3D game handles all scrolling */
    #scroll-wrap{overflow:hidden !important;}
    #guesses-section{display:none;}

    /* ─── Previous Guesses Section ─── */
    #guesses-section{
      position:relative;z-index:10;
      min-height:50vh;
      pointer-events:auto;
      background:linear-gradient(180deg,rgba(8,2,18,0.98) 0%,rgba(5,1,12,1) 100%);
      border-top:3px solid;border-image:linear-gradient(90deg,#ff2d95,#22d3ee,#a855f7) 1;
      padding:24px 20px 100px;

    }
    #guesses-section h2{
      text-align:center;margin:0 0 20px;font-size:18px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
      background:linear-gradient(90deg,#ff2d95,#22d3ee,#a855f7);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    #guesses-count{font-size:13px;color:#94a3b8;text-align:center;margin:-14px 0 20px;font-weight:400;}
    .guess-card{
      display:flex;align-items:center;gap:12px;

      transition:border-color 0.2s;

    .guess-card:hover{border-color:rgba(34,211,238,0.3);}
    .guess-rank-badge{
      min-width:56px;padding:4px 8px;text-align:center;
      font-size:12px;font-weight:800;border-radius:6px;
      color:#fff;
    }
    .rank-hot{background:linear-gradient(135deg,#ff2d95,#ff6b6b);}
    .rank-warm{background:linear-gradient(135deg,#a855f7,#6366f1);}
    .rank-cool{background:linear-gradient(135deg,#22d3ee,#3b82f6);}
    .rank-cold{background:rgba(148,163,184,0.2);color:#94a3b8;}
    .rank-unknown{background:rgba(100,100,100,0.2);color:#666;}
    .guess-word-text{flex:1;font-size:15px;font-weight:700;color:#f1f5f9;letter-spacing:0.5px;}
    .guess-user-info{display:flex;align-items:center;gap:6px;max-width:140px;}
    .guess-user-pic{width:22px;height:22px;border-radius:50%;border:1px solid rgba(34,211,238,0.2);}
    .guess-user-name{font-size:11px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .guess-platform{font-size:10px;color:rgba(148,163,184,0.5);text-transform:uppercase;letter-spacing:1px;}
    #no-guesses{text-align:center;color:#64748b;padding:40px;font-size:14px;}

    /* ─── Bottom bars ─── */

    #me-link img{width:100%;height:100%;object-fit:cover;}
    .guess-input-wrap{

    #login-bar a svg{flex-shrink:0;}

    /* ─── Typing bubble ─── */
    #type-bubble{
      position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);z-index:501;
      pointer-events:none;
      transition:opacity 0.2s ease;
    }
    .type-bubble-hidden{opacity:0;}
    .type-bubble-visible{opacity:1;}
    #type-bubble-inner{
      display:inline-flex;align-items:center;
      padding:0;
      background:rgba(220,225,232,0.95);

    }
    #type-bubble-content{
      display:inline-flex;align-items:center;gap:4px;
      padding:12px 24px;
      background:#fff;
      border-radius:16px;
      margin:6px;
    }
    #type-bubble-text{
      font-family:'Inter',sans-serif;font-size:18px;font-weight:600;
      letter-spacing:1px;text-transform:lowercase;
      color:#1e293b;
    }
    #type-bubble-cursor{
      font-family:'Inter',sans-serif;font-size:20px;font-weight:300;
      color:#9ca3af;animation:cursorBlink 0.8s step-end infinite;
    }
    @keyframes cursorBlink{0%,100%{opacity:1;}50%{opacity:0;}}
    @media (pointer: fine){#type-bubble{display:none;}}

    /* ─── Touch device overrides ─── */
    @media (pointer: coarse) {

      #me-link{width:80px;height:80px;border-radius:24px;}
      #me-link svg{width:40px;height:40px;}
      .guess-input-wrap{border-radius:26px;padding:0 24px 0 0;}
      #guess-input{font-size:38px;padding:24px 12px 24px 30px;}
      #guess-input::placeholder{font-size:38px;}
      .guess-search-icon{width:40px;height:40px;}
      #guess-btn{font-size:30px;padding:26px 40px;border-radius:26px;letter-spacing:1px;}
      #login-bar{padding:20px 24px;padding-bottom:max(20px,env(safe-area-inset-bottom));}
      #login-bar a{font-size:36px;padding:28px 64px;border-radius:28px;gap:18px;}
      #login-bar a svg{width:44px;height:44px;}
      #type-bubble-inner{padding:0;border-radius:36px;box-shadow:0 6px 32px rgba(0,0,0,0.15),0 2px 6px rgba(0,0,0,0.1);}
      #type-bubble-content{padding:24px 48px;border-radius:30px;margin:10px;gap:6px;}
      #type-bubble-text{font-size:44px;letter-spacing:3px;}
      #type-bubble-cursor{font-size:48px;}
      /* Guesses section scaled for touch */
      #guesses-section{padding:60px 50px 240px;}
      #guesses-section h2{font-size:44px;margin-bottom:40px;letter-spacing:4px;}
      #guesses-count{font-size:30px;margin:-30px 0 40px;}
      .guess-card{padding:28px 36px;margin-bottom:16px;border-radius:20px;gap:24px;border-width:2px;}
      .guess-rank-badge{min-width:130px;padding:10px 16px;font-size:28px;border-radius:12px;}
      .guess-word-text{font-size:36px;}
      .guess-user-info{gap:12px;max-width:320px;}
      .guess-user-pic{width:48px;height:48px;}
      .guess-user-name{font-size:24px;}
      .guess-platform{font-size:20px;}
      #no-guesses{font-size:32px;padding:80px;}
    }
  </style>

  <script src="./socket.io/socket.io.js"></script>
  <script>
  (function() {
    var RELAY_URL = location.port ? 'http://' + location.hostname + ':3000' : location.origin;
    var user = null;
    var guestName = localStorage.getItem('searchle_guest_name') || '';
    try { user = JSON.parse(localStorage.getItem('searchle_user')); } catch(e){}

    var guessBar = document.getElementById('guess-bar');
    var loginBar = document.getElementById('login-bar');
    var guessInput = document.getElementById('guess-input');
    var guessBtn = document.getElementById('guess-btn');
    var meLink = document.getElementById('me-link');
    var guessesList = document.getElementById('guesses-list');
    var guessesCount = document.getElementById('guesses-count');
    var _bp = location.pathname.endsWith('/') ? location.pathname.slice(0, -1) : location.pathname.replace(/\/[^/]*$/, '');
    var sock = io({ path: _bp + '/socket.io', reconnection: true, reconnectionDelay: 2000, reconnectionDelayMax: 10000, reconnectionAttempts: Infinity, transports: ['polling', 'websocket'] });
    var totalRankedWords = 0;

    var loginLink = document.getElementById('discord-login-link');
    loginLink.href = RELAY_URL + '/auth/discord?returnTo=' + encodeURIComponent(location.href);

    function sanitizeGuestName(name) {
      return (name || '').replace(/[^a-zA-Z0-9_\- ]/g, '').trim().slice(0, 20);
    }

    function ensureGuestOverlay() {
      var existing = document.getElementById('mp-auth-overlay');
      if (existing) return existing;
      var style = document.createElement('style');
      style.id = 'mp-auth-overlay-style';
      style.textContent = 'body.mp-login-preview-active{overflow:hidden}.mp-login-screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:clamp(16px,4vw,28px);background:transparent;z-index:10000}.mp-login-card{position:relative;text-align:center;max-width:420px;width:min(420px,calc(100vw - 32px));padding:28px 24px;background:rgba(11,16,27,.24);border:1px solid rgba(255,255,255,.2);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.3);backdrop-filter:blur(22px) saturate(175%);-webkit-backdrop-filter:blur(22px) saturate(175%);overflow:hidden;color:#fff}.mp-login-card:before{content:\"\";position:absolute;inset:1px;border-radius:23px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 38%,rgba(255,255,255,.03));pointer-events:none}.mp-login-card>*{position:relative;z-index:1}.mp-login-card h2{margin:0 0 10px;color:#fff;letter-spacing:.08em;text-transform:uppercase}.mp-login-card p{margin:0 0 12px;color:rgba(236,242,255,.82)}.mp-login-logo{display:flex;justify-content:center;align-items:center;margin:0 auto 16px}.mp-game-logo{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}.mp-searchle-logo .search{font-size:1rem;font-weight:800;color:#f8fbff;letter-spacing:.08em;text-transform:uppercase}.mp-searchle-logo .le{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;font-size:.88rem;font-weight:800;color:#0f172a;background:linear-gradient(135deg,#22d3ee,#67e8f9)}.mp-guest-row{display:flex;gap:10px;margin:10px 0 16px}.mp-guest-input{flex:1;padding:12px 14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:14px;color:#fff;font-size:.92rem;font-family:inherit;outline:none;min-width:0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.mp-guest-input:focus{border-color:rgba(140,180,255,.85);box-shadow:0 0 0 4px rgba(88,101,242,.16)}.mp-guest-input::placeholder{color:rgba(236,242,255,.58)}.mp-guest-btn{padding:12px 16px;background:linear-gradient(135deg,rgba(124,140,255,.92),rgba(88,101,242,.88));border:1px solid rgba(255,255,255,.16);border-radius:14px;color:#fff;font-size:.92rem;font-weight:800;cursor:pointer;white-space:nowrap;font-family:inherit;box-shadow:0 10px 24px rgba(74,96,220,.28)}.mp-login-divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:rgba(236,242,255,.56);font-size:.74rem}.mp-login-divider:before,.mp-login-divider:after{content:\"\";flex:1;height:1px;background:rgba(255,255,255,.12)}.mp-auth-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 18px;border-radius:14px;text-decoration:none;font-weight:700;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-sizing:border-box}.mp-auth-btn.discord{background:rgba(88,101,242,.82);color:#fff}.mp-auth-btn.github{margin-top:10px;background:rgba(15,23,42,.48);color:#fff}@media (max-width:560px){.mp-login-card{padding:24px 18px}.mp-guest-row{flex-direction:column}.mp-guest-btn{width:100%}}';
      document.head.appendChild(style);
      document.addEventListener('keydown', function (e) {
        if (document.body.classList.contains('mp-login-preview-active')) {
          var target = e.target;
          var tag = target && target.tagName;
          if (tag !== 'INPUT' && tag !== 'TEXTAREA' && !(target && target.isContentEditable)) {
            e.stopImmediatePropagation();
          }
        }
      }, true);
      var overlay = document.createElement('div');
      overlay.id = 'mp-auth-overlay';
      overlay.className = 'mp-login-screen';
      overlay.innerHTML = '<div class="mp-login-card"><div class="mp-login-logo"><div class="mp-game-logo mp-searchle-logo" aria-label="Searchle logo"><span class="search">Search</span><span class="le">le</span></div></div><h2>Searchle</h2><p>Choose a username to play instantly, or sign in for stats and rewards.</p><div class="mp-guest-row"><input id="mp-guest-name-input" type="text" class="mp-guest-input" placeholder="Choose a username" maxlength="20" autocomplete="off" autocapitalize="off"><button id="mp-guest-play-btn" class="mp-guest-btn" type="button">Play</button></div><div class="mp-login-divider"><span>or sign in for stats & rewards</span></div><a class="mp-auth-btn discord" href="' + RELAY_URL + '/auth/discord?returnTo=' + encodeURIComponent(location.href) + '">Login with Discord</a><a class="mp-auth-btn github" href="' + RELAY_URL + '/auth/github?returnTo=' + encodeURIComponent(location.href) + '">Login with GitHub</a></div>';
      document.body.appendChild(overlay);
      var input = overlay.querySelector('#mp-guest-name-input');
      var playBtn = overlay.querySelector('#mp-guest-play-btn');
      function continueAsGuest() {
        showGuestReady(input.value);
      }
      playBtn.addEventListener('click', continueAsGuest);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') continueAsGuest();
      });
      return overlay;
    }

    function hideGuestOverlay() {
      var overlay = ensureGuestOverlay();
      document.body.classList.remove('mp-login-preview-active');
      overlay.style.display = 'none';
    }

    function showGuestOverlay() {
      var overlay = ensureGuestOverlay();
      var input = overlay.querySelector('#mp-guest-name-input');
      input.value = guestName || '';
      loginBar.style.display = 'none';
      guessBar.style.display = 'none';
      document.body.classList.add('mp-login-preview-active');
      overlay.style.display = 'flex';
      setTimeout(function () {
        input.focus();
        input.select();
      }, 0);
    }

    function showGuestReady(name) {
      guestName = sanitizeGuestName(name) || 'Guest';
      localStorage.setItem('searchle_guest_name', guestName);
      hideGuestOverlay();
      loginBar.style.display = 'none';
      guessBar.style.display = 'flex';
    }

    function showLoggedIn() {
      hideGuestOverlay();
      loginBar.style.display = 'none';
      guessBar.style.display = 'flex';
      if (user && user.avatar && meLink) {
        meLink.innerHTML = '<img src="' + user.avatar + '" alt="">';
      }
    }

    var params = new URLSearchParams(location.search);
    var authToken = params.get('auth');
    if (authToken) {
      params.delete('auth');
      params.delete('sso_checked');
      var remaining = params.toString();
      history.replaceState({}, '', location.pathname + (remaining ? '?' + remaining : ''));
      fetch(RELAY_URL + '/api/auth/exchange?token=' + encodeURIComponent(authToken))
        .then(function(r){ return r.json(); })
        .then(function(data){
          if (data.ok && data.user) {
            user = data.user;
            localStorage.setItem('searchle_user', JSON.stringify(user));
            showLoggedIn();
          } else {
            showGuestOverlay();
          }
        }).catch(showGuestOverlay);
    } else if (params.get('sso_checked')) {
      params.delete('sso_checked');
      var rest = params.toString();
      history.replaceState({}, '', location.pathname + (rest ? '?' + rest : ''));
      if (user && user.id) showLoggedIn();
      else showGuestOverlay();
    } else {
      fetch(RELAY_URL + '/api/me/session')
        .then(function(r){ return r.json(); })
        .then(function(data){
          if (data.ok && data.user) {
            user = {
              id: data.user.id,
              username: data.user.username,
              globalName: data.user.displayName || data.user.username,
              avatar: data.user.avatar || null,
              provider: 'discord'
            };
            localStorage.setItem('searchle_user', JSON.stringify(user));
            showLoggedIn();
            return;
          }
          showGuestOverlay();
        }).catch(function(){
          if (user && user.id) showLoggedIn();
          else showGuestOverlay();
        });
    }

    // ─── Previous Guesses Rendering ───
    function rankClass(rank) {
      if (rank === 9999999) return 'rank-unknown';
      if (rank <= 1000) return 'rank-hot';
      if (rank <= 10000) return 'rank-warm';
      if (rank <= 100000) return 'rank-cool';
      return 'rank-cold';
    }

    function formatRank(rank) {
      if (rank === 9999999) return '???';
      if (rank === 100001) return '100,000+';
      return rank.toLocaleString();
    }

    function renderGuessCard(g) {
      var card = document.createElement('div');
      card.className = 'guess-card';
      card.innerHTML =
        '<span class="guess-rank-badge ' + rankClass(g.rank) + '">#' + formatRank(g.rank) + '</span>' +
        '<span class="guess-word-text">' + g.word + '</span>' +
        '<span class="guess-user-info">' +
          (g.user.profilePic ? '<img class="guess-user-pic" src="' + g.user.profilePic + '" alt="">' : '') +
          '<span class="guess-user-name">' + (g.user.displayName || g.user.username || '') + '</span>' +
        '</span>';
      return card;
    }

    function renderAllGuesses(guesses) {
      guessesList.innerHTML = '';
      if (!guesses || guesses.length === 0) {
        guessesList.innerHTML = '<div id="no-guesses">No guesses yet — be the first!</div>';
        guessesCount.textContent = '';
        return;
      }
      // Sort by rank (best first)
      var sorted = guesses.slice().sort(function(a, b) { return a.rank - b.rank; });
      guessesCount.textContent = sorted.length + ' guesses so far';
      for (var i = 0; i < sorted.length; i++) {
        guessesList.appendChild(renderGuessCard(sorted[i]));
      }
    }

    function addSingleGuess(g) {
      // Remove "no guesses" placeholder
      var placeholder = document.getElementById('no-guesses');
      if (placeholder) placeholder.remove();
      // Re-render all (keeps sort order correct)
      // Collect existing + new from the sock game-state cache
    }

    // ─── Socket.IO: game state + live updates ───
    var currentGuesses = [];

    sock.on('game-state', function(state) {
      currentGuesses = state.guesses || [];
      totalRankedWords = state.totalRankedWords || 0;
      renderAllGuesses(currentGuesses);
    });

    sock.on('new-guess', function(guess) {
      currentGuesses.push(guess);
      renderAllGuesses(currentGuesses);
    });

    sock.on('new-game', function() {
      currentGuesses = [];
      renderAllGuesses([]);
    });

    // ─── Library Word Toast ───
    sock.on('library-word-new', function(data) {
      if (!data || !data.word) return;
      // Website players should only see their own newly added library words.
      if (!data.self) return;
      showLibraryToast(data.word);
    });
    function showLibraryToast(word, displayName) {
      if (document.body.classList.contains('obs-mode')) return;
      if (!document.getElementById('library-toast-style')) {
        var s = document.createElement('style');
        s.id = 'library-toast-style';
        s.textContent = '.library-toast{position:fixed;top:24px;right:24px;display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#1a0f00,#2d1f0a);border:3px solid #8b6914;border-radius:20px;padding:16px 28px 16px 12px;color:#f5deb3;z-index:10000;opacity:0;transform:translateX(50px);transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 8px 30px rgba(139,105,20,.4);overflow:visible}.library-toast.show{opacity:1;transform:translateX(0)}.library-toast .toast-logo{width:100px;height:100px;border-radius:50%;flex-shrink:0;margin:-14px -8px -14px -12px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}.library-toast .toast-text{display:flex;flex-direction:column}.library-toast .toast-header{font-size:18px;font-weight:700;color:#f5deb3;line-height:1.2}.library-toast .toast-word{font-size:36px;font-weight:800;color:#ffd700;letter-spacing:2px;line-height:1.2}.library-toast .toast-player{font-size:16px;color:#c0a050;margin-top:4px;font-weight:600}[data-theme="light"] .library-toast{background:linear-gradient(135deg,#fff8e1,#fff3cd);border-color:#d4a017;box-shadow:0 8px 30px rgba(212,160,23,.3)}[data-theme="light"] .library-toast .toast-header{color:#5d4200}[data-theme="light"] .library-toast .toast-word{color:#b8860b}[data-theme="light"] .library-toast .toast-player{color:#8b7030}@media(pointer:coarse){.library-toast{top:40px;right:40px;gap:20px;border-width:3px;border-radius:24px;padding:24px 40px 24px 16px;box-shadow:0 8px 30px rgba(139,105,20,.4)}.library-toast .toast-logo{width:160px;height:160px;margin:-30px -12px -30px -20px;filter:drop-shadow(0 5px 16px rgba(0,0,0,.6))}.library-toast .toast-header{font-size:28px}.library-toast .toast-word{font-size:54px;letter-spacing:3px}.library-toast .toast-player{font-size:22px}}';
        document.head.appendChild(s);
      }
      var t = document.createElement('div');
      t.className = 'library-toast';
      var html = '<img class="toast-logo" src="img/wt-logo.png" alt="">' +
        '<div class="toast-text"><div class="toast-header">Word Found!</div>' +
        '<div class="toast-word">' + word.toUpperCase() + '</div>';
      if (displayName) html += '<div class="toast-player">' + displayName + '</div>';
      html += '</div>';
      t.innerHTML = html;
      document.body.appendChild(t);
      setTimeout(function() { t.classList.add('show'); }, 10);
      setTimeout(function() {
        t.classList.remove('show');
        setTimeout(function() { t.remove(); }, 300);
      }, 3000);
    }

    // Submit guess
    function submit() {
      var w = guessInput.value.trim().toLowerCase();
      if (!w || !/^[a-z]+$/.test(w)) return;
      var guessUser = user && user.id
        ? { id: user.id, platformUserId: user.id, username: user.username, displayName: user.globalName || user.displayName || user.username, profilePic: user.avatar || null, customColor: null }
        : guestName
          ? { id: 'web_' + guestName.toLowerCase().replace(/[^a-z0-9]/g, '_'), platformUserId: 'web_' + guestName.toLowerCase().replace(/[^a-z0-9]/g, '_'), username: guestName, displayName: guestName, profilePic: null, customColor: null }
          : null;
      if (!guessUser) {
        showGuestOverlay();
        return;
      }
      sock.emit('test-guess', {
        message: w,
        user: guessUser,
        platform: user && user.id ? 'discord' : 'web'
      });
      guessInput.value = '';
      guessInput.dispatchEvent(new Event('input'));
      guessInput.focus();
    }
    guessBtn.onclick = submit;
    guessInput.onkeydown = function(e){ if(e.key==='Enter') submit(); };

    // ─── Keyboard scroll lock ───
    var scrollWrap = document.getElementById('scroll-wrap');
    guessInput.addEventListener('focus', function() {
      scrollWrap.classList.add('kb-open');
      scrollWrap.scrollTop = 0;
    });
    guessInput.addEventListener('blur', function() {
      scrollWrap.classList.remove('kb-open');
    });

    // Typing bubble (touch devices only)
    var typeBubble = document.getElementById('type-bubble');
    var typeBubbleText = document.getElementById('type-bubble-text');
    if (typeBubble && window.matchMedia('(pointer: coarse)').matches) {
      var cssScale = 980 / window.innerWidth;

      var fullViewportH = window.innerHeight * cssScale;

      function positionBubble() {
        var visibleH;
        var kbUp = false;
        if ('virtualKeyboard' in navigator && navigator.virtualKeyboard.boundingRect && navigator.virtualKeyboard.boundingRect.height > 0) {
          visibleH = (window.innerHeight - navigator.virtualKeyboard.boundingRect.height) * cssScale;
          kbUp = true;
        } else if (window.visualViewport) {
          visibleH = window.visualViewport.height * cssScale;
          kbUp = visibleH < fullViewportH * 0.85;
        } else {
          visibleH = window.innerHeight * cssScale * 0.45;
        }
        if (!kbUp) {
          typeBubble.className = 'type-bubble-hidden';
          return;
        }
        typeBubble.style.top = Math.max(60, visibleH * 0.7 - 100) + 'px';
      }

      if ('virtualKeyboard' in navigator && navigator.virtualKeyboard.overlaysContent) {
        navigator.virtualKeyboard.addEventListener('geometrychange', positionBubble);
      }
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', positionBubble);
      }

      guessInput.addEventListener('focus', function() {
        updateBubble();
        typeBubble.className = 'type-bubble-visible';
        setTimeout(positionBubble, 300);
      });
      guessInput.addEventListener('blur', function() {
        typeBubble.className = 'type-bubble-hidden';
      });
      guessInput.addEventListener('input', updateBubble);
      function updateBubble() {
        var val = guessInput.value.trim().toLowerCase();
        typeBubbleText.textContent = val || '';
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('scroll', function() {
        if (window.visualViewport.offsetTop > 0) scrollWrap.scrollTop = 0;
      });
    }

    // ─── Portal iframe auth: accept user data via postMessage ───
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'searchle-auth' && e.data.user && e.data.user.id) {
        user = e.data.user;
        localStorage.setItem('searchle_user', JSON.stringify(user));
        showLoggedIn();
      }
    });
    // If embedded in an iframe, notify parent we're ready
    if (window.parent !== window) {
      try { window.parent.postMessage({ type: 'searchle-ready' }, '*'); } catch(e){}
    }
  })();
  </script>
