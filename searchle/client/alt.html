<script>
// Alt-mode spacer sync — keeps #game-spacer's height equal to the
// recent-guess ticker's bottom edge plus a small gap, so the chip grid
// section starts right under the ticker regardless of viewport
// dimensions. The ticker is positioned by alt-main.js's DOMRenderer
// layout and its absolute Y can shift based on viewport height (it's
// height-constrained but the formula isn't purely proportional).
// Without this, static vh-units overlap the ticker at shorter
// viewport heights.
//
// `.pinned-guess-entry` stays in the selector as a fallback: regular
// Searchle (main.js) still renders that card, and this script is shared
// markup — matching either keeps a non-alt page from measuring nothing.
(function() {
  if (!window.__ALT_MODE) return;
  const GAP_PX = 8; // breathing room between ticker bottom and grid top
  // Track the MAX ticker bottom observed since load (or last viewport
  // resize). The spacer can only grow, never shrink. Prevents the grid
  // from moving up when a new game starts and the measured element
  // temporarily renders shorter (no winner card pushing it down) — the
  // spacer locks in at its tallest sane value and stays put.
  let maxBottom = 0;
  function syncSpacer() {
    // Skip while the stats drawer is open (or still animating shut) —
    // the drawer pushes the ticker down temporarily, and the
    // ratchet below would otherwise lock that displaced position in
    // permanently. alt-main.js publishes the drawer state here (and
    // clears it ~800ms after close so a tick can't catch the ticker
    // mid-descent).
    if (window.__altDrawerOffset > 0) return false;
    const pg = document.querySelector('.recent-ticker, .pinned-guess-entry');
    const sp = document.getElementById('game-spacer');
    if (!pg || !sp) return false;
    const rect = pg.getBoundingClientRect();
    if (rect.height === 0 || rect.bottom <= 0) return false; // not laid out yet
    if (rect.bottom > maxBottom) {
      maxBottom = rect.bottom;
      sp.style.height = Math.ceil(maxBottom + GAP_PX) + 'px';
    }
    return true;
  }
  // Exposed so the game bundle (alt-main.js) can trigger an immediate
  // re-sync the moment it repositions the ticker (updateLayout /
  // first guess of a round) instead of waiting for the next poll tick.
  window.__altSpacerSync = syncSpacer;
  // Window resize: re-measure but never shrink. Previously we reset
  // maxBottom to 0 on resize so the new (smaller) viewport would
  // dictate the spacer height, but spurious resize events (OBS scene
  // transitions, iframe re-pumps, devtools toggles, etc.) caused the
  // grid to jump up between rounds. Keeping the max ratchet across
  // resizes means the spacer can still GROW for a taller layout but
  // never collapses on a shorter measurement.
  window.addEventListener('resize', () => { syncSpacer(); });
  // Poll forever. This used to stop after 80 ticks (40s), which froze
  // the spacer while the header kept changing height between rounds
  // (combined-card vs 4-slot winner layouts) — the ticker would
  // move DOWN at a round transition and the grid never followed,
  // leaving the top card buried under the ticker until a page
  // refresh. One getBoundingClientRect every 500ms is negligible, and
  // the max-ratchet means most ticks are no-ops anyway.
  function tick() {
    syncSpacer();
    setTimeout(tick, 500);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', tick);
  } else {
    tick();
  }
  window.addEventListener('load', syncSpacer);
})();
</script>
