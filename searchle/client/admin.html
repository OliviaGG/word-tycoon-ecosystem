<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Searchle 3.0 — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #0a0e17; color: #f1f5f9;
      padding: 24px; max-width: 800px; margin: 0 auto;
    }
    h1 { font-size: 28px; margin-bottom: 24px; color: #22d3ee; }
    h2 { font-size: 18px; margin: 20px 0 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; font-size: 12px; }
    .card {
      background: #111827; border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 12px; padding: 20px; margin-bottom: 16px;
    }
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; }
    .status-dot.ok { background: #34d399; box-shadow: 0 0 8px rgba(52, 211, 153, 0.5); }
    .status-dot.err { background: #f43f5e; }
    .btn {
      padding: 10px 20px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background 0.2s; margin-right: 8px; margin-bottom: 8px;
    }
    .btn-primary { background: #22d3ee; color: #0a0e17; }
    .btn-primary:hover { background: #06b6d4; }
    .btn-danger { background: rgba(244, 63, 94, 0.2); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }
    .btn-danger:hover { background: rgba(244, 63, 94, 0.3); }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid rgba(148, 163, 184, 0.08); }
    th { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    td { font-size: 14px; }
    .target-word { font-size: 24px; font-weight: 800; color: #fbbf24; letter-spacing: 2px; text-transform: uppercase; }
    .model-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin: 2px; }
    .model-active { background: rgba(52, 211, 153, 0.2); color: #34d399; }
    .model-inactive { background: rgba(148, 163, 184, 0.1); color: #64748b; }
    #game-info { font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>Searchle 3.0 Admin</h1>

  <div class="card">
    <div class="status">
      <div class="status-dot ok" id="status-dot"></div>
      <span id="status-text">Connected</span>
    </div>
    <div id="game-info">Loading...</div>
  </div>

  <h2>Controls</h2>
  <div class="card">
    <button class="btn btn-primary" id="btn-new-game">New Game</button>
    <button class="btn btn-danger" id="btn-reset-jackpot">Reset Jackpot</button>
    <button class="btn btn-primary" id="btn-reveal">Reveal Word</button>
    <p id="reveal-result" style="margin-top: 12px; font-size: 14px;"></p>
  </div>

  <h2>Models</h2>
  <div class="card" id="models-card">Loading...</div>

  <h2>Recent Wins</h2>
  <div class="card">
    <table>
      <thead><tr><th>Player</th><th>Word</th><th>Guesses</th><th>Time</th></tr></thead>
      <tbody id="history-body"></tbody>
    </table>
  </div>

  <script>
    async function loadState() {
      try {
        const res = await fetch('/api/game/state');
        const data = await res.json();
        const info = document.getElementById('game-info');
        info.innerHTML = `
          <strong>Guesses:</strong> ${data.guessCount} &nbsp;|&nbsp;
          <strong>Status:</strong> ${data.isWon ? '<span style="color:#34d399">WON</span>' : '<span style="color:#22d3ee">In Progress</span>'}
          ${data.targetWord ? '<br><span class="target-word">' + data.targetWord + '</span>' : ''}
        `;
      } catch (e) {
        document.getElementById('status-dot').className = 'status-dot err';
        document.getElementById('status-text').textContent = 'Disconnected';
      }
    }

    async function loadModels() {
      try {
        const res = await fetch('/api/models');
        const data = await res.json();
        const card = document.getElementById('models-card');
        let html = '<p style="margin-bottom:8px;font-size:13px;color:#94a3b8">Vocabulary: ' + data.totalVocabulary.toLocaleString() + ' words</p>';
        data.models.forEach(m => {
          const cls = m.active ? 'model-active' : 'model-inactive';
          html += '<span class="model-badge ' + cls + '">' + m.name + (m.wordCount ? ' (' + m.wordCount.toLocaleString() + ')' : '') + '</span> ';
        });
        card.innerHTML = html;
      } catch (e) {}
    }

    async function loadHistory() {
      try {
        const res = await fetch('/api/game/history');
        const data = await res.json();
        const body = document.getElementById('history-body');
        body.innerHTML = data.slice(-20).reverse().map(w => {
          const date = new Date(w.timestamp);
          const time = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          return '<tr><td>' + (w.user.displayName || '?') + '</td><td style="font-weight:700;text-transform:uppercase">' + w.word + '</td><td>' + w.guessCount + '</td><td style="color:#64748b">' + time + '</td></tr>';
        }).join('');
      } catch (e) {}
    }

    document.getElementById('btn-new-game').onclick = async () => {
      await fetch('/api/game/new', { method: 'POST' });
      loadState();
    };

    document.getElementById('btn-reset-jackpot').onclick = async () => {
      await fetch('/api/game/reset-jackpot', { method: 'POST' });
      loadState();
    };

    document.getElementById('btn-reveal').onclick = async () => {
      const res = await fetch('/api/game/reveal');
      const data = await res.json();
      document.getElementById('reveal-result').innerHTML = '<span class="target-word">' + data.targetWord + '</span>';
    };

    // Initial load
    loadState();
    loadModels();
    loadHistory();
    setInterval(loadState, 5000);
    setInterval(loadHistory, 10000);
  </script>
</body>
</html>
