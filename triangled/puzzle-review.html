<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 24px; }
  h1 { text-align: center; font-size: 28px; color: #f0c040; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
  .card { background: #16213e; border-radius: 12px; overflow: hidden; border: 1px solid #2a2a4a; transition: transform 0.15s; }
  .card:hover { transform: translateY(-3px); border-color: #f0c040; }
  .card-img { width: 100%; height: 220px; object-fit: cover; display: block; background: #0f0f23; }
  .no-img { width: 100%; height: 220px; display: flex; align-items: center; justify-content: center; background: #0f0f23; color: #444; font-size: 14px; }
  .card-body { padding: 16px; }
  .card-date { font-size: 12px; color: #888; margin-bottom: 4px; }
  .card-theme { font-size: 20px; font-weight: 700; color: #f0c040; margin-bottom: 4px; }
  .card-hint { font-size: 13px; color: #aaa; font-style: italic; margin-bottom: 12px; }
  .spangram { display: inline-block; background: #f0c040; color: #1a1a2e; font-weight: 700; padding: 3px 10px; border-radius: 20px; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
  .words { display: flex; flex-wrap: wrap; gap: 6px; }
  .word { background: #2a2a4a; color: #ccc; padding: 3px 10px; border-radius: 14px; font-size: 13px; }
  .card-footer { padding: 8px 16px; border-top: 1px solid #2a2a4a; display: flex; justify-content: space-between; font-size: 11px; color: #666; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .status-dot.ok { background: #4caf50; }
  .status-dot.warn { background: #ff9800; }
  .status-dot.bad { background: #f44336; }
  .duplicate-badge { background: #ff5722; color: white; font-size: 10px; padding: 2px 6px; border-radius: 8px; margin-left: 8px; }
</style>
</head>
<body>

ms everywhere","spangram":"gratitude","words":["care","love","family","gift","hug","warmth","card","treat","mom","bouquet"],"hasGrid":true,"image":"2026-05-10_option1.jpg"},{"date":"2026-05-11","theme":"Morning Commute","themeHint":"Getting to work or school","spangram":"travelers","words":["highway","bridge","scooter","shuttle","walk","train","crowd","pedal"],"hasGrid":true,"image":"2026-05-11_option1.jpg"},{"date":"2026-05-12","theme":"Weekday Lunch Break","themeHint":"Midday meal during a busy week","spangram":"sandwiches","words":["pasta","soup","wrap","bagel","drink","yogurt","chips","apple","pickle"],"hasGrid":true,"image":"2026-05-12_option1.jpg"},{"date":"2026-05-13","theme":"Mid-Week Bloom","themeHint":"Brightening up the hump day","spangram":"flowering","words":["peony","lilac","lupin","flora","sunlit","crisp","meadow","vine","spray"],"hasGrid":true,"image":"2026-05-13_option1.jpg"},{"date":"2026-05-14","theme":"Spring Hiking Essentials","themeHint":"What to pack for a trail adventure","spangram":"backpack","words":["boots","flask","trail","snack","compass","map","jacket","firstaid","hat"],"hasGrid":true,"image":"2026-05-14_option1.jpg"},{"date":"2026-05-15","theme":"Spring Workspace","themeHint":"Refreshing your desk for the season","spangram":"workspace","words":["desk","pens","chair","bright","monitor","notebook","calendar","lamp"],"hasGrid":true,"image":"2026-05-15_option1.jpg"}];

// Track duplicate themes
const themeCounts = {};
puzzles.forEach(p => { themeCounts[p.theme] = (themeCounts[p.theme] || 0) + 1; });

const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const grid = document.getElementById('grid');
puzzles.forEach(p => {
  const d = new Date(p.date + 'T12:00:00');
  const dateLabel = `${weekdays[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}`;
  const isDupe = themeCounts[p.theme] > 1;

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    ${p.image
      ? `<img class="card-img" src="data/puzzles/${p.image}" alt="${p.theme}">`
      : `<div class="no-img">No image generated</div>`}
    <div class="card-body">
      <div class="card-date">${dateLabel}</div>
      <div class="card-theme">${p.theme}${isDupe ? '<span class="duplicate-badge">REPEAT</span>' : ''}</div>
      <div class="card-hint">${p.themeHint}</div>
      <div class="spangram">${p.spangram}</div>
      <div class="words">
        ${p.words.map(w => `<span class="word">${w}</span>`).join('')}
      </div>
    </div>
    <div class="card-footer">
      <span><span class="status-dot ${p.hasGrid ? 'ok' : 'bad'}"></span>${p.hasGrid ? 'Grid ready' : 'No grid'}</span>
      <span>${p.image ? 'Has image' : 'No image'}</span>
    </div>
  `;
  grid.appendChild(card);
});
</script>
