<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Tycoon Banner Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0c12;
      --panel: #151827;
      --text: #f5f7ff;
      --muted: #9ea5c7;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(124, 58, 237, 0.18), transparent 34%),
        linear-gradient(180deg, #0b0c12, #121522);
      color: var(--text);
    }
    .wrap {
      width: min(1400px, calc(100% - 32px));
      margin: 32px auto 48px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      backdrop-filter: blur(10px);
    }
    .label {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Word Tycoon Banner Set</h1>
    <p>Quick first-pass banners for today. Each one is a standalone SVG and easy to replace later.</p>
    <div class="grid">
      <div class="card"><div class="label">Searchle</div><img src="searchle-banner.svg" alt="Searchle banner"></div>
      <div class="card"><div class="label">recTangled</div><img src="rectangled-banner.svg" alt="recTangled banner"></div>
      <div class="card"><div class="label">erecTangled</div><img src="sproutle-banner.svg" alt="erecTangled banner"></div>
      <div class="card"><div class="label">Word 500</div><img src="word500-banner.svg" alt="Word 500 banner"></div>
      <div class="card"><div class="label">Wordle</div><img src="wordle-banner.svg" alt="Wordle banner"></div>
      <div class="card"><div class="label">Betweenly</div><img src="betweenly-banner.svg" alt="Betweenly banner"></div>
      <div class="card"><div class="label">PixeLetters</div><img src="pixeletters-banner.svg" alt="PixeLetters banner"></div>
      <div class="card"><div class="label">Spelling Bee</div><img src="spellingbee-banner.svg" alt="Spelling Bee banner"></div>
      <div class="card"><div class="label">Figural</div><img src="figural-banner.svg" alt="Figural banner"></div>
      <div class="card"><div class="label">Word Mine</div><img src="wordmine-banner.svg" alt="Word Mine banner"></div>
      <div class="card"><div class="label">UnWordle</div><img src="unwordle-banner.svg" alt="UnWordle banner"></div>
    </div>
  </div>
</body>
</html>
