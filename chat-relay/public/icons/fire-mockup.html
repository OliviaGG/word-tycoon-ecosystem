<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fire Icon Mockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  svg { overflow: visible; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 40px;
    gap: 60px;
    min-height: 100vh;
  }
  h2 {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #555;
    text-align: center;
  }
  section { display: flex; flex-direction: column; align-items: center; gap: 20px; }

  /* --- Size scale --- */
  .sizes {
    display: flex;
    align-items: flex-end;
    gap: 32px;
  }
  .size-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 12px 8px;
  }
  .size-label {
    font-size: 11px;
    color: #444;
  }

  /* --- Context mockups --- */
  .contexts {
    display: flex;
    align-items: flex-end;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .ctx-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .ctx-label {
    font-size: 11px;
    color: #444;
  }

  /* Streak badge */
  .streak-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 999px;
    padding: 6px 14px 6px 10px;
    font-size: 13px;
    font-weight: 600;
    color: #e0e0e0;
  }

  /* Stat card */
  .stat-card {
    background: #2a1a0a;
    border: 1px solid #5c3000;
    border-radius: 12px;
    padding: 20px 28px;
    text-align: center;
    width: 130px;
  }
  .stat-number {
    font-size: 28px;
    font-weight: 800;
    color: #FFA000;
    line-height: 1;
    margin: 6px 0 4px;
  }
  .stat-sub {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #8a6000;
  }

  /* Light UI pill */
  .light-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 999px;
    padding: 8px 16px 8px 12px;
    font-size: 14px;
    font-weight: 600;
    color: #222;
  }

  /* vs Emoji */
  .vs-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .vs-arrow { color: #333; font-size: 18px; }
  .vs-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .vs-item span { font-size: 10px; color: #444; }
  .emoji-fire { font-size: 32px; line-height: 1; }
</style>
</head>
