<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Game Icon Generator v2</title>
<style>
  body { background: #1a1a2e; color: #fff; font-family: system-ui; padding: 20px; }
  h1 { text-align: center; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
  .icon-card { text-align: center; }
  .icon-card canvas { border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  .icon-card p { margin: 8px 0; font-size: 14px; opacity: 0.8; }
  button { background: #4CAF50; color: white; border: none; padding: 12px 32px; font-size: 16px; border-radius: 8px; cursor: pointer; margin: 20px auto; display: block; }
  button:hover { background: #45a049; }
  .dl-btn { background: #2196F3; padding: 6px 16px; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<h1>Redesigned Game Icons (v2)</h1>
<button onclick="saveAll()">Save All to Server</button>
<div class="grid" id="grid"></div>

<script>
const SIZE = 512;
const R = 80;

const games = ['searchle','word500','pixeletters','spellingbee','figural','word1000'];

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function hexagon(ctx, cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 3) * i - Math.PI / 6;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawBase(ctx, bgColor1, bgColor2) {
  roundRect(ctx, 0, 0, SIZE, SIZE, R);
  ctx.clip();
  const grad = ctx.createRadialGradient(SIZE/2, SIZE/3, 50, SIZE/2, SIZE/2, SIZE * 0.8);
  grad.addColorStop(0, bgColor1);
  grad.addColorStop(1, bgColor2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, SIZE, SIZE);
}

// ─── SEARCHLE v2 ─── Dark navy, golden word bars, search bar, magnifying glass overlay
function drawSearchle(ctx) {
  drawBase(ctx, '#162640', '#0a1628');

  // Subtle grid pattern in background
  ctx.strokeStyle = 'rgba(90,140,200,0.04)';
  ctx.lineWidth = 1;
  for (let i = 0; i < SIZE; i += 40) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(SIZE, i); ctx.stroke();
  }

  // Stacked golden word bars with varying widths (showing the ranked word list)
  const bars = [
    { y: 55, w: 380, score: '2297', hot: true },
    { y: 115, w: 340, score: '328' },
    { y: 175, w: 310, score: '356' },
    { y: 235, w: 280, score: '577' },
    { y: 295, w: 250, score: '623' },
    { y: 355, w: 220, score: '783' },
  ];

  bars.forEach((bar, i) => {
    const bx = (SIZE - bar.w) / 2;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    roundRect(ctx, bx + 4, bar.y + 4, bar.w, 44, 8);
    ctx.fill();
    // Bar gradient (golden)
    const g = ctx.createLinearGradient(bx, bar.y, bx + bar.w, bar.y + 44);
    if (bar.hot) {
      g.addColorStop(0, '#e8c840');
      g.addColorStop(0.5, '#d4b030');
      g.addColorStop(1, '#b89420');
    } else {
      g.addColorStop(0, '#c8a42e');
      g.addColorStop(0.5, '#b89428');
      g.addColorStop(1, '#987418');
    }
    ctx.fillStyle = g;
    roundRect(ctx, bx, bar.y, bar.w, 44, 8);
    ctx.fill();
    // Highlight on top edge
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    roundRect(ctx, bx, bar.y, bar.w, 4, 8);
    ctx.fill();
    // Score badge on right
    ctx.fillStyle = 'rgba(10,22,40,0.6)';
    ctx.beginPath();
    ctx.arc(bx + bar.w - 32, bar.y + 22, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#8ab8e0';
    ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(bar.score, bx + bar.w - 32, bar.y + 22);
    // Word placeholder bars
    ctx.fillStyle = 'rgba(10,22,40,0.25)';
    const pw = 60 + Math.random() * 80;
    roundRect(ctx, bx + 14, bar.y + 15, pw, 14, 4);
    ctx.fill();
  });

  // Search bar at bottom
  ctx.fillStyle = 'rgba(20,40,65,0.85)';
  roundRect(ctx, 80, 425, 352, 50, 25);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90,159,212,0.35)';
  ctx.lineWidth = 2;
  roundRect(ctx, 80, 425, 352, 50, 25);
  ctx.stroke();
  // Magnifying glass icon in search bar
  ctx.save();
  ctx.strokeStyle = '#5a9fd4';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.arc(400, 449, 12, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(409, 458);
  ctx.lineTo(418, 467);
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();
  // Placeholder text in search bar
  ctx.fillStyle = 'rgba(90,159,212,0.3)';
  roundRect(ctx, 110, 443, 120, 12, 4);
  ctx.fill();

  // XP bar at very top
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  roundRect(ctx, 60, 25, 392, 12, 6);
  ctx.fill();
  const xpG = ctx.createLinearGradient(60, 25, 340, 25);
  xpG.addColorStop(0, '#00cc44');
  xpG.addColorStop(1, '#008822');
  ctx.fillStyle = xpG;
  roundRect(ctx, 60, 25, 280, 12, 6);
  ctx.fill();
}

// ─── WORD 500 v2 ─── Neon purple border, letter tiles with score indicators (0/1/4)
function drawWord500(ctx) {
  drawBase(ctx, '#1c1640', '#0e0a28');

  // Neon purple outer glow
  ctx.save();
  ctx.shadowColor = '#a855f7';
  ctx.shadowBlur = 35;
  ctx.strokeStyle = '#a855f7';
  ctx.lineWidth = 4;
  roundRect(ctx, 16, 16, SIZE - 32, SIZE - 32, R - 6);
  ctx.stroke();
  ctx.restore();
  // Second inner glow
  ctx.strokeStyle = 'rgba(168,85,247,0.2)';
  ctx.lineWidth = 1.5;
  roundRect(ctx, 30, 30, SIZE - 60, SIZE - 60, R - 12);
  ctx.stroke();

  // Title area
  ctx.fillStyle = '#a855f7';
  ctx.font = 'bold 32px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('WORD 500', 60, 72);

  // Word rows (showing guesses with score indicators)
  const rows = [
    { letters: ['S','T','A','R','E'], scores: [0,1,4], sColors: ['#22c55e','#eab308','#ef4444'] },
    { letters: ['C','L','U','M','P'], scores: [1,0,3], sColors: ['#eab308','#22c55e','#f97316'] },
    { letters: ['B','R','I','N','G'], scores: [2,2,1], sColors: ['#eab308','#eab308','#eab308'] },
    { letters: ['W','O','R','L','D'], scores: [5,0,0], sColors: ['#22c55e','#22c55e','#22c55e'] },
  ];

  const tw = 52, tgap = 10;
  const gridX = 60;

  rows.forEach((row, ri) => {
    const ry = 100 + ri * 72;
    // Letter tiles
    for (let ci = 0; ci < 5; ci++) {
      const tx = gridX + ci * (tw + tgap);
      ctx.fillStyle = 'rgba(168,85,247,0.15)';
      ctx.strokeStyle = 'rgba(168,85,247,0.45)';
      ctx.lineWidth = 2;
      roundRect(ctx, tx, ry, tw, tw, 6);
      ctx.fill();
      roundRect(ctx, tx, ry, tw, tw, 6);
      ctx.stroke();
      // Letter
      ctx.fillStyle = '#e0d0f8';
      ctx.font = 'bold 26px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(row.letters[ci], tx + tw/2, ry + tw/2 + 1);
    }
    // Score indicators (colored number badges)
    for (let si = 0; si < 3; si++) {
      const sx = gridX + 5 * (tw + tgap) + 16 + si * 36;
      ctx.fillStyle = row.sColors[si];
      roundRect(ctx, sx, ry + 10, 30, 30, 6);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(row.scores[si]), sx + 15, ry + 26);
    }
  });

  // Empty rows
  for (let ri = 0; ri < 2; ri++) {
    const ry = 388 + ri * 52;
    for (let ci = 0; ci < 5; ci++) {
      const tx = gridX + ci * (tw + tgap);
      ctx.fillStyle = 'rgba(168,85,247,0.06)';
      ctx.strokeStyle = 'rgba(168,85,247,0.2)';
      ctx.lineWidth = 1.5;
      roundRect(ctx, tx, ry, 44, 44, 5);
      ctx.fill();
      roundRect(ctx, tx, ry, 44, 44, 5);
      ctx.stroke();
    }
  }
}

// ─── PIXELETTERS v2 ─── Dark grid, progressive pixel reveal forming a word
function drawPixeletters(ctx) {
  drawBase(ctx, '#141432', '#0a0a1e');

  const gridSize = 16;
  const cellSize = (SIZE - 60) / gridSize;
  const ox = 30, oy = 30;

  // Draw grid
  ctx.strokeStyle = 'rgba(80,80,140,0.15)';
  ctx.lineWidth = 0.5;
  for (let r = 0; r <= gridSize; r++) {
    ctx.beginPath(); ctx.moveTo(ox, oy + r * cellSize); ctx.lineTo(ox + gridSize * cellSize, oy + r * cellSize); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox + r * cellSize, oy); ctx.lineTo(ox + r * cellSize, oy + gridSize * cellSize); ctx.stroke();
  }

  // Letter "W" fully revealed (left side) in magenta
  const letterW = [
    [2,3],[2,4],[2,5],[2,6],[2,7],[2,8],[2,9],[2,10],[2,11],
    [3,10],[3,11],
    [4,8],[4,9],
    [5,10],[5,11],
    [6,3],[6,4],[6,5],[6,6],[6,7],[6,8],[6,9],[6,10],[6,11],
  ];
  letterW.forEach(([c,r]) => {
    const g = ctx.createLinearGradient(ox+c*cellSize, oy+r*cellSize, ox+(c+1)*cellSize, oy+(r+1)*cellSize);
    g.addColorStop(0, '#ff69b4');
    g.addColorStop(1, '#e91e8c');
    ctx.fillStyle = g;
    roundRect(ctx, ox+c*cellSize+1, oy+r*cellSize+1, cellSize-2, cellSize-2, 2);
    ctx.fill();
  });

  // Letter "T" partially revealed (right side) - some pixels solid, some fading
  const letterT_full = [
    [9,3],[10,3],[11,3],[12,3],[13,3],
    [11,4],[11,5],[11,6],[11,7],[11,8],[11,9],[11,10],[11,11],
  ];
  const letterT_partial = [
    [9,4],[10,4],[12,4],[13,4],
  ];
  letterT_full.forEach(([c,r]) => {
    ctx.fillStyle = '#00d4ff';
    roundRect(ctx, ox+c*cellSize+1, oy+r*cellSize+1, cellSize-2, cellSize-2, 2);
    ctx.fill();
  });
  letterT_partial.forEach(([c,r]) => {
    ctx.fillStyle = 'rgba(0,212,255,0.35)';
    roundRect(ctx, ox+c*cellSize+1, oy+r*cellSize+1, cellSize-2, cellSize-2, 2);
    ctx.fill();
  });

  // Scattered unrevealed pixels (colorful, various opacities)
  const scatterColors = ['#ff69b4','#00d4ff','#ffdd00','#a855f7','#00ff88','#ff6b35'];
  const scatter = [
    [0,1,0.7],[1,0,0.5],[15,2,0.6],[14,0,0.4],[0,14,0.5],[1,15,0.3],
    [15,13,0.7],[14,15,0.4],[8,1,0.3],[7,14,0.5],[0,7,0.4],[15,8,0.6],
    [3,14,0.3],[12,14,0.5],[0,5,0.6],[15,5,0.3],[8,15,0.4],[7,0,0.5],
    [14,7,0.3],[1,12,0.4],[13,1,0.5],[4,0,0.3],[10,15,0.4],[5,15,0.5],
  ];
  scatter.forEach(([c,r,a], i) => {
    ctx.globalAlpha = a;
    ctx.fillStyle = scatterColors[i % scatterColors.length];
    roundRect(ctx, ox+c*cellSize+1, oy+r*cellSize+1, cellSize-2, cellSize-2, 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Glow around the revealed letters
  ctx.save();
  ctx.shadowColor = '#ff69b4';
  ctx.shadowBlur = 20;
  ctx.fillStyle = 'rgba(255,105,180,0.01)';
  ctx.fillRect(ox+2*cellSize, oy+3*cellSize, 5*cellSize, 9*cellSize);
  ctx.shadowColor = '#00d4ff';
  ctx.fillRect(ox+9*cellSize, oy+3*cellSize, 5*cellSize, 9*cellSize);
  ctx.restore();
}

// ─── SPELLING BEE v2 ─── Honeycomb with center highlighted letter, warm amber
function drawSpellingBee(ctx) {
  const grad = ctx.createLinearGradient(0, 0, SIZE, SIZE);
  grad.addColorStop(0, '#f59e0b');
  grad.addColorStop(0.5, '#e8910a');
  grad.addColorStop(1, '#c27803');
  ctx.save();
  roundRect(ctx, 0, 0, SIZE, SIZE, R);
  ctx.clip();
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Subtle honeycomb texture in background
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let row = -1; row < 8; row++) {
    for (let col = -1; col < 8; col++) {
      const hx = col * 80 + (row % 2) * 40;
      const hy = row * 70;
      hexagon(ctx, hx, hy, 38);
      ctx.stroke();
    }
  }

  // Main honeycomb — center + 6 surrounding
  const hexR = 58;
  const cx = SIZE/2, cy = SIZE/2;
  const positions = [
    { dx: 0, dy: 0, letter: 'P', center: true },
    { dx: 0, dy: -(hexR*1.78), letter: 'S' },
    { dx: hexR*1.54, dy: -(hexR*0.89), letter: 'B' },
    { dx: hexR*1.54, dy: hexR*0.89, letter: 'L' },
    { dx: 0, dy: hexR*1.78, letter: 'E' },
    { dx: -hexR*1.54, dy: hexR*0.89, letter: 'A' },
    { dx: -hexR*1.54, dy: -(hexR*0.89), letter: 'N' },
  ];

  positions.forEach(p => {
    const hx = cx + p.dx;
    const hy = cy + p.dy;

    // Drop shadow
    ctx.fillStyle = 'rgba(120,53,15,0.3)';
    hexagon(ctx, hx + 3, hy + 4, hexR - 1);
    ctx.fill();

    if (p.center) {
      // Bright yellow center hex
      const hg = ctx.createRadialGradient(hx-5, hy-5, 0, hx, hy, hexR);
      hg.addColorStop(0, '#fde68a');
      hg.addColorStop(0.4, '#fcd34d');
      hg.addColorStop(1, '#f59e0b');
      ctx.fillStyle = hg;
    } else {
      // Darker amber outer hexes
      const hg = ctx.createRadialGradient(hx-5, hy-5, 0, hx, hy, hexR);
      hg.addColorStop(0, '#d97706');
      hg.addColorStop(0.5, '#b45309');
      hg.addColorStop(1, '#92400e');
      ctx.fillStyle = hg;
    }
    hexagon(ctx, hx, hy, hexR - 1);
    ctx.fill();

    // Top highlight
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    const a1 = -Math.PI/6;
    const a2 = -Math.PI/6 + Math.PI;
    ctx.moveTo(hx + (hexR-4)*Math.cos(a1), hy + (hexR-4)*Math.sin(a1));
    for (let i = 0; i <= 3; i++) {
      const angle = a1 + (Math.PI/3)*i;
      ctx.lineTo(hx + (hexR-4)*Math.cos(angle-Math.PI/6), hy + (hexR-4)*Math.sin(angle-Math.PI/6));
    }
    ctx.closePath();
    ctx.fill();

    // Letter
    ctx.fillStyle = p.center ? '#78350f' : '#fef3c7';
    ctx.font = `bold ${p.center ? 42 : 36}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.letter, hx, hy + 3);
  });

  // Bee icon (top-right area)
  const bx = 400, by = 80;
  // Body
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.ellipse(bx, by, 22, 16, -0.2, 0, Math.PI*2);
  ctx.fill();
  // Stripes
  ctx.fillStyle = '#292524';
  ctx.fillRect(bx-8, by-6, 7, 12);
  ctx.fillRect(bx+4, by-6, 7, 12);
  // Wings
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.ellipse(bx-8, by-18, 14, 9, -0.4, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(bx+10, by-18, 14, 9, 0.4, 0, Math.PI*2);
  ctx.fill();
  // Eyes
  ctx.fillStyle = '#292524';
  ctx.beginPath();
  ctx.arc(bx+16, by-2, 3, 0, Math.PI*2);
  ctx.fill();

  // Decorative stars
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '22px system-ui';
  ctx.fillText('✦', 85, 85);
  ctx.fillText('✦', 420, 440);
  ctx.font = '16px system-ui';
  ctx.fillText('✦', 100, 430);
  ctx.fillText('✦', 380, 100);

  ctx.restore();
}

// ─── FIGURAL v2 ─── Word tiles with geometric shape clues (diamond/circle/triangle)
function drawFigural(ctx) {
  drawBase(ctx, '#1a1030', '#0e0820');

  // Title gradient
  ctx.save();
  const tg = ctx.createLinearGradient(50, 30, 300, 30);
  tg.addColorStop(0, '#06b6d4');
  tg.addColorStop(0.5, '#d946ef');
  tg.addColorStop(1, '#f97316');
  ctx.fillStyle = tg;
  ctx.font = 'bold 28px system-ui';
  ctx.textAlign = 'left';
  ctx.letterSpacing = '8px';
  ctx.fillText('F I G U R A L', 60, 55);
  ctx.restore();

  // Legend: diamond=? circle=? triangle=?
  const legendX = 130;
  const ly = 80;
  // Diamond
  ctx.fillStyle = '#22d3ee';
  ctx.beginPath();
  ctx.moveTo(legendX, ly); ctx.lineTo(legendX+8, ly+8); ctx.lineTo(legendX, ly+16); ctx.lineTo(legendX-8, ly+8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '14px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('= ?', legendX+12, ly+13);
  // Circle
  ctx.fillStyle = '#f472b6';
  ctx.beginPath();
  ctx.arc(legendX+80, ly+8, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('= ?', legendX+92, ly+13);
  // Triangle
  ctx.fillStyle = '#4ade80';
  ctx.beginPath();
  ctx.moveTo(legendX+160, ly); ctx.lineTo(legendX+168, ly+16); ctx.lineTo(legendX+152, ly+16);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('= ?', legendX+172, ly+13);

  // Word guess rows with shape clues
  const rows = [
    { letters: ['C','R','A','W','L'], shapes: ['circle','circle','circle','circle','circle'], border: '#f472b6' },
    { letters: ['R','E','A','D','S'], shapes: ['diamond','triangle','circle','circle','circle'], border: '#f472b6' },
    { letters: ['R','E','P','A','Y'], shapes: ['circle','triangle','circle','circle','circle'], border: '#f472b6' },
  ];

  const tw = 72, tgap = 10;
  const gx = (SIZE - 5*(tw+tgap)+tgap) / 2;

  rows.forEach((row, ri) => {
    const ry = 110 + ri * 100;

    // Row border glow
    ctx.save();
    ctx.shadowColor = row.border;
    ctx.shadowBlur = 8;
    ctx.strokeStyle = row.border;
    ctx.lineWidth = 2;
    roundRect(ctx, gx-8, ry-4, 5*(tw+tgap)+6, tw+30, 10);
    ctx.stroke();
    ctx.restore();

    for (let ci = 0; ci < 5; ci++) {
      const tx = gx + ci * (tw + tgap);

      // Tile background
      ctx.fillStyle = 'rgba(168,85,247,0.12)';
      roundRect(ctx, tx, ry, tw, tw+20, 8);
      ctx.fill();

      // Letter
      ctx.fillStyle = '#e8d8f8';
      ctx.font = 'bold 32px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(row.letters[ci], tx + tw/2, ry + 30);

      // Shape below letter
      const sx = tx + tw/2, sy = ry + tw + 4;
      if (row.shapes[ci] === 'circle') {
        ctx.fillStyle = '#f472b6';
        ctx.beginPath();
        ctx.arc(sx, sy, 7, 0, Math.PI*2);
        ctx.fill();
      } else if (row.shapes[ci] === 'diamond') {
        ctx.fillStyle = '#22d3ee';
        ctx.beginPath();
        ctx.moveTo(sx, sy-8); ctx.lineTo(sx+7, sy); ctx.lineTo(sx, sy+8); ctx.lineTo(sx-7, sy);
        ctx.closePath(); ctx.fill();
      } else if (row.shapes[ci] === 'triangle') {
        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.moveTo(sx, sy-8); ctx.lineTo(sx+7, sy+5); ctx.lineTo(sx-7, sy+5);
        ctx.closePath(); ctx.fill();
      }
    }
  });

  // Empty row
  const ey = 410;
  for (let ci = 0; ci < 5; ci++) {
    const tx = gx + ci * (tw + tgap);
    ctx.fillStyle = 'rgba(168,85,247,0.06)';
    ctx.strokeStyle = 'rgba(168,85,247,0.2)';
    ctx.lineWidth = 1.5;
    roundRect(ctx, tx, ey, tw, tw+20, 8);
    ctx.fill();
    roundRect(ctx, tx, ey, tw, tw+20, 8);
    ctx.stroke();
  }
}

// ─── WORD 1000 v2 ─── Single player word guessing, warm green theme, distance display
function drawWord1000(ctx) {
  drawBase(ctx, '#141e30', '#0a1220');

  // Warm gradient accent bar at top
  const topG = ctx.createLinearGradient(40, 30, SIZE-40, 30);
  topG.addColorStop(0, '#ef4444');
  topG.addColorStop(0.3, '#f97316');
  topG.addColorStop(0.6, '#eab308');
  topG.addColorStop(1, '#22c55e');
  ctx.fillStyle = topG;
  roundRect(ctx, 40, 25, SIZE-80, 10, 5);
  ctx.fill();

  // "1000" large number with glow
  ctx.save();
  ctx.shadowColor = '#22c55e';
  ctx.shadowBlur = 30;
  ctx.fillStyle = '#22c55e';
  ctx.font = 'bold 88px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('1000', SIZE/2, 115);
  ctx.restore();

  // Subtitle
  ctx.fillStyle = 'rgba(34,197,94,0.5)';
  ctx.font = '16px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('SINGLE PLAYER', SIZE/2, 145);

  // Word guesses with distance thermometer
  const guesses = [
    { letters: ['S','T','A','R','E'], dist: 142, color: '#ef4444' },
    { letters: ['C','L','U','M','P'], dist: 356, color: '#f97316' },
    { letters: ['B','R','I','N','G'], dist: 612, color: '#eab308' },
    { letters: ['W','O','R','L','D'], dist: 987, color: '#22c55e' },
  ];

  const tw = 48, tgap = 8;
  const gx = 50;

  guesses.forEach((g, i) => {
    const ry = 170 + i * 68;

    // Row background
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    roundRect(ctx, 40, ry-4, SIZE-80, 58, 8);
    ctx.fill();

    // Color indicator bar on left
    ctx.fillStyle = g.color;
    roundRect(ctx, 40, ry-4, 5, 58, 3);
    ctx.fill();

    // Letter tiles
    for (let ci = 0; ci < 5; ci++) {
      const tx = gx + 15 + ci * (tw + tgap);
      ctx.fillStyle = 'rgba(168,130,247,0.12)';
      ctx.strokeStyle = 'rgba(168,130,247,0.3)';
      ctx.lineWidth = 1.5;
      roundRect(ctx, tx, ry, tw, 46, 5);
      ctx.fill();
      roundRect(ctx, tx, ry, tw, 46, 5);
      ctx.stroke();
      // Letter
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.font = 'bold 22px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(g.letters[ci], tx + tw/2, ry + 24);
    }

    // Distance bar
    const barX = 345;
    const barW = 90;
    const fillW = (g.dist / 1000) * barW;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRect(ctx, barX, ry + 15, barW, 16, 8);
    ctx.fill();
    ctx.fillStyle = g.color + '80';
    roundRect(ctx, barX, ry + 15, fillW, 16, 8);
    ctx.fill();

    // Distance number
    ctx.fillStyle = g.color;
    ctx.font = 'bold 18px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(String(g.dist), SIZE - 50, ry + 28);
  });

  // Empty rows
  for (let i = 0; i < 2; i++) {
    const ry = 442 + i * 34;
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    roundRect(ctx, 40, ry, SIZE-80, 28, 6);
    ctx.fill();
  }
}

// ─── RENDER ───
function renderAll() {
  const grid = document.getElementById('grid');
  const drawFns = {
    searchle: drawSearchle,
    word500: drawWord500,
    pixeletters: drawPixeletters,
    spellingbee: drawSpellingBee,
    figural: drawFigural,
    word1000: drawWord1000,
  };

  games.forEach(name => {
    const card = document.createElement('div');
    card.className = 'icon-card';
    const canvas = document.createElement('canvas');
    canvas.width = SIZE;
    canvas.height = SIZE;
    canvas.style.width = '220px';
    canvas.style.height = '220px';
    canvas.id = 'icon-' + name;
    const ctx = canvas.getContext('2d');
    ctx.save();
    drawFns[name](ctx);
    ctx.restore();
    const label = document.createElement('p');
    label.textContent = name;
    card.appendChild(canvas);
    card.appendChild(label);
    grid.appendChild(card);
  });
}

async function saveAll() {
  const results = [];
  for (const name of games) {
    const canvas = document.getElementById('icon-' + name);
    const dataUrl = canvas.toDataURL('image/png');
    try {
      const resp = await fetch('http://localhost:8899/save/game-' + name + '.png', {
        method: 'POST',
        body: dataUrl
      });
      const json = await resp.json();
      results.push(name + ': ' + (json.ok ? json.size + ' bytes' : 'ERROR'));
    } catch (e) {
      results.push(name + ': FAILED - ' + e.message);
    }
  }
  alert('Save results:\\n' + results.join('\\n'));
}

renderAll();
</script>
