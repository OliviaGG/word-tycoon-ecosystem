  <div class="app-shell">
    <header class="player-header">
      <div class="player-row">
        <button class="player-summary" type="button" data-panel="profile" aria-label="Open your profile">

        </button>
        <button class="square-button settings-button" type="button" data-panel="settings" aria-label="Settings"><svg class="icon"><use href="#i-settings"/></svg></button>
      </div>
      <div class="resource-row">
        <button class="resource" type="button" data-panel="profile" aria-label="Your XP balance"><svg class="icon"><use href="#i-coin"/></svg><strong id="xpBalance">0</strong><span>XP</span><b>+</b></button>

        <div class="kingdom-shade"></div>

        <a id="playButton" class="play-button" href="https://wordtycoon.live/wordle/solo/"><svg class="icon"><use href="#i-swords"/></svg><span>LET’S PLAY</span><span class="play-arrow" aria-hidden="true">›</span></a>
