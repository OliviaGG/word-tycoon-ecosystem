<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020a25">
  <title>Reconnect to WikiContexto</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #020a25; color: #f3f8ff; font: 17px/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 400px; padding: 32px 26px; border: 1px solid #1768b3; border-radius: 20px; background: #03142f; text-align: center; }
    h1 { font-size: 26px; line-height: 1.25; margin: 12px 0; }
    .brand { color: #19e4ff; font-size: 13px; font-weight: 800; letter-spacing: 2px; }
    p { color: #96b8dd; margin: 16px 0 24px; }
    button { width: 100%; min-height: 52px; padding: 12px 20px; border: 0; border-radius: 12px; background: #19e4ff; color: #020a25; font: inherit; font-weight: 800; cursor: pointer; }
    button:focus-visible { outline: 3px solid #ffe536; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">WIKICONTEXTO</div>
    <h1>Let’s reconnect</h1>
    <p>WikiContexto needs an internet connection to load puzzles and check guesses. Your saved progress will be here when you return.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { window.location.reload(); });
    window.addEventListener('online', function () { window.location.reload(); });
  </script>
</body>
</html>
