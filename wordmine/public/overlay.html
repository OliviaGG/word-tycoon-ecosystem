<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Word Mine — OBS Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/wordmine.css"/>
  <script src="/portal/js/library-toast.js" data-mode="mp" defer></script>
  <style>
    body { background: transparent !important; overflow: hidden; }
    .overlay-wrap {
      width: 360px;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .overlay-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(10,14,23,0.92);
      border-radius: 10px 10px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
    }
    .overlay-title { font-weight: 800; font-size: 0.9rem; flex: 1; }
    .overlay-xp { color: #4caf50; font-weight: 700; font-size: 0.9rem; }
    .overlay-body {
      background: rgba(10,14,23,0.88);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 10px 10px;
      padding: 8px 12px;
      max-height: 500px;
      overflow: hidden;
    }
    .overlay-feed { display: flex; flex-direction: column; gap: 3px; }
    .overlay-feed-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      padding: 2px 4px;
      border-radius: 4px;
      animation: word-in 0.3s ease-out;
    }
    .overlay-feed-player { color: var(--text-dim); font-weight: 600; }
    .overlay-feed-title {
      font-size: 0.6rem; font-weight: 600; opacity: 0.8;
      margin-left: 4px; padding: 0 3px;
      border: 1px solid currentColor; border-radius: 3px;
      vertical-align: middle;
    }
    .overlay-feed-word { font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-left: 6px; }
    .overlay-feed-xp { font-weight: 700; }
    .overlay-depth { margin-top: 6px; }
    .overlay-hidden { display: none !important; }
    /* Letter cells — scaled down for 360px overlay, read-only */
    .overlay-letters { margin: 6px 0; }
    .overlay-letters .letter-row { justify-content: center; gap: 4px; }
    .overlay-letters .letter-cell {
      width: 34px; height: 34px; font-size: 0.8rem;
      pointer-events: none;
    }
    .overlay-letters .letter-cell:hover {
      transform: none; border-color: var(--border); background: var(--surface-light);
    }
    .overlay-letters .letter-cell.word-glow {
      animation: letter-glow 0.6s ease-out forwards;
      pointer-events: none;
    }
    .overlay-letters .letter-cell.letter-dimmed { opacity: 0.25; }
    .overlay-letters .letter-start-badge {
      font-size: 0.45rem;
      min-width: 12px;
      height: 12px;
      bottom: -3px;
      left: -3px;
    }
  </style>
</head>
<body>
  <div class="overlay-wrap">
    <div class="overlay-header">
      <span class="overlay-title">&#9935; <span id="mine-name">Word Mine</span></span>
      <span class="overlay-xp">&#10022; <span id="found-count">0</span>/<span id="words-total">0</span></span>
    </div>
    <div class="overlay-body">
      <!-- Letter grid (read-only) -->
      <div id="letter-area" class="letter-area overlay-letters">
        <div id="letter-row-1" class="letter-row"></div>
        <div id="letter-row-2" class="letter-row"></div>
        <div id="letter-row-3" class="letter-row"></div>
      </div>
      <!-- Depth mini-meter -->
      <div id="depth-mini" class="overlay-depth depth-tiers"></div>
      <!-- Feed -->
      <div id="feed" class="overlay-feed"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/overlay.js?v=2"></script>
</body>
</html>
