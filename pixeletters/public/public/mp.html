<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#151a2d"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="PixeLetters Live"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="description" content="Install PixeLetters for one-tap multiplayer pixel-word puzzles."/>
  <title>PixeLetters Multiplayer</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="icon" type="image/svg+xml" href="app-icon.svg"/>
  <link rel="apple-touch-icon" href="app-icon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="pixeletters-play.css"/>
  <style>
    .mp-login-screen{display:flex;align-items:center;justify-content:center;height:100dvh;padding:20px}
    .mp-login-card{text-align:center;max-width:360px;width:100%;padding:32px 24px;background:var(--surface,#1a1a2e);border:1px solid var(--border,#2a2a3a);border-radius:16px}
    .mp-login-logo{font-size:48px;margin-bottom:12px}
    .mp-login-card h1{font-size:1.6rem;font-weight:800;letter-spacing:.15em;margin-bottom:8px}
    .mp-login-card p{color:var(--text-dim,#888);font-size:.85rem;margin-bottom:4px}
    .mp-login-sub{margin-bottom:20px!important}
    .mp-discord-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:8px;background:#5865F2;color:#fff;font-size:.9rem;text-decoration:none;font-weight:700;transition:background .2s}
    .mp-discord-btn:hover{background:#4752c4}
    .mp-google-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:8px;background:#fff;color:#444;font-size:.9rem;text-decoration:none;font-weight:700;transition:background .2s,box-shadow .2s;border:1px solid #dadce0}
    .mp-google-btn:hover{background:#f7f8f8;box-shadow:0 1px 3px rgba(0,0,0,.15)}
    .mp-login-divider{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--text-dim,#888);font-size:.75rem}
    .mp-login-divider::before,.mp-login-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}
    .mp-back-link{display:block;margin-top:16px;color:var(--text-dim,#888);text-decoration:none;font-size:.8rem}
    .mp-back-link:hover{color:var(--text,#e0e0e0)}
  </style>
</head>
<body>
  <div id="app">
    <!-- Login Screen (shown until authenticated) -->
    <div id="login-screen" class="mp-login-screen">
      <div class="mp-login-card">
        <div class="mp-login-logo">&#x1F9E9;</div>
        <h1>PixeLetters</h1>
        <p>Multiplayer mode — compete with other players in real-time!</p>
        <p class="mp-login-sub">Log in to play and track your stats.</p>
        <a href="/auth/google?returnTo=/game/pixeletters/mp.html" class="mp-google-btn">
          <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Login with Google
        </a>
        <div class="mp-login-divider"><span>or</span></div>
        <a href="/auth/discord?returnTo=/game/pixeletters/mp.html" class="mp-discord-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
          Login with Discord
        </a>
        <a href="https://wordtycoon.live" class="mp-back-link">&larr; Back to Word Tycoon</a>
      </div>
    </div>

    <!-- Game UI (hidden until authenticated) -->
    <div id="game-ui" style="display:none;flex-direction:column;height:100%">
      <!-- Header -->
      <header id="header">
        <a href="https://wordtycoon.live" class="hub-btn" title="Word Tycoon Hub">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <span class="title"><span class="p">P</span><span class="i">I</span><span class="x">X</span><span class="e">E</span>LETTERS</span>
        <span class="mp-badge">MP</span>
        <span class="guess-counter" id="guess-counter">0</span>
        <div class="header-actions">
          <button class="stats-toggle-btn" id="stats-toggle" title="Stats">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
          </button>
        </div>
      </header>

      <!-- Stats Dropdown -->
      <div class="stats-dropdown hidden" id="stats-dropdown">
        <div class="stats-dropdown-header">
          <span>Your Stats</span>
          <button class="stats-close" id="stats-close">&times;</button>
        </div>
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-val" id="stat-wins">0</div>
            <div class="stat-lbl">Wins</div>
          </div>
          <div class="stat-item">
            <div class="stat-val" id="stat-games">0</div>
            <div class="stat-lbl">Played</div>
          </div>
          <div class="stat-item">
            <div class="stat-val" id="stat-avg">-</div>
            <div class="stat-lbl">Avg Guesses</div>
          </div>
          <div class="stat-item">
            <div class="stat-val" id="stat-streak">0</div>
            <div class="stat-lbl">Win Streak</div>
          </div>
        </div>
        <div class="stats-history" id="stats-history"></div>
        <a href="https://wordtycoon.live/me" class="stats-portal-link" target="_blank">View full stats on Word Tycoon &rarr;</a>
      </div>

      <!-- Mode badge (read-only in MP, set by server) -->
      <div class="mode-badge" id="mode-badge"></div>

      <!-- Game Area -->
      <main id="game-area">
        <div class="pixel-grid" id="pixel-grid"></div>
      </main>

      <!-- QWERTY Keyboard -->
      <div class="keyboard" id="keyboard"></div>

      <!-- Error toast -->
      <div class="error-toast hidden" id="error-toast"></div>

      <!-- Win overlay -->
      <div class="win-overlay hidden" id="win-overlay">
        <div class="win-modal">
          <div class="win-pic" id="win-pic"></div>
          <div class="win-name" id="win-name"></div>
          <div class="win-word" id="win-word"></div>
          <div class="win-count" id="win-count"></div>
          <div class="win-countdown" id="win-countdown"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="mp-init.js"></script>
  <script src="pwa-install.js"></script>
</body>
</html>
